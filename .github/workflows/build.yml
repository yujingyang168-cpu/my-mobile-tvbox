name: Build and Auto Release Mobile TVBox

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - 'version.json'
      - 'README.md'
      - 'app/release.keystore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      # 步骤 1：生成工程配置、永久密钥与资源布局
      - name: Setup Android Project Configuration
        env:
          RUN_NUM: ${{ github.run_number }}
        run: |
          mkdir -p app/src/main/java/com/mobile/tvbox
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/menu
          mkdir -p app/src/main/res/xml

          # 永久专属签名密钥检测与生成
          if [ ! -f app/release.keystore ]; then
            keytool -genkeypair -v -keystore app/release.keystore \
              -alias tvbox \
              -keyalg RSA \
              -keysize 2048 \
              -validity 36500 \
              -storepass tvbox123456 \
              -keypass tvbox123456 \
              -dname "CN=MobileTVBox, OU=App, O=TVBox, L=City, ST=Province, C=CN"
          fi

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "MobileTVBox"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mobile.tvbox'
              compileSdk 34

              defaultConfig {
                  applicationId "com.mobile.tvbox"
                  minSdk 24
                  targetSdk 34
                  versionCode $((1000 + RUN_NUM))
                  versionName "2.${RUN_NUM}"
              }

              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'tvbox123456'
                      keyAlias 'tvbox'
                      keyPassword 'tvbox123456'
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.release
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.media3:media3-datasource:1.2.1'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'com.github.bumptech.glide:glide:4.16.0'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
          }
          EOF

          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-files-path name="apk_downloads" path="." />
              <external-path name="external_storage_root" path="." />
          </paths>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">影视盒子</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
              <color name="bg_dark">#0E1117</color>
              <color name="card_dark">#161B22</color>
              <color name="card_stroke">#30363D</color>
              <color name="primary_indigo">#6366F1</color>
              <color name="accent_purple">#8B5CF6</color>
              <color name="text_muted">#8B949E</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.MobileTVBox" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/primary_indigo</item>
                  <item name="android:statusBarColor">@color/black</item>
                  <item name="android:navigationBarColor">@color/card_dark</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_app_icon.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0B0E14" android:pathData="M0,0h108v108h-108z"/>
              <path android:strokeColor="#30363D" android:strokeWidth="1.5" android:fillColor="#00000000" android:pathData="M54,12 A42,42 0 1,1 53.9,12 Z"/>
              <path android:fillColor="#1F2430" android:pathData="M54,20 L84,37 L84,71 L54,88 L24,71 L24,37 Z"/>
              <path android:fillColor="#4F46E5" android:pathData="M54,54 L24,37 L54,20 L54,54 Z"/>
              <path android:fillColor="#7C3AED" android:pathData="M54,54 L54,20 L84,37 L54,54 Z"/>
              <path android:fillColor="#F59E0B" android:pathData="M48,42 L66,54 L48,66 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_nav_vod.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M4,6H20V18H4z M2,4v16h20V4H2z M6,8h2v2H6z M6,11h2v2H6z M6,14h2v2H6z M16,8h2v2h-2z M16,11h2v2h-2z M16,14h2v2h-2z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_nav_live.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M21,3H3c-1.1,0 -2,0.9 -2,2v12c0,1.1 0.9,2 2,2h5v2h8v-2h5c1.1,0 2,-0.9 2,-2V5c0,-1.1 -0.9,-2 -2,-2zm0,14H3V5h18v12zm-11,-2l6,-4l-6,-4v8z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_nav_settings.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFF" android:pathData="M19.14,12.94c0.04,-0.3 0.06,-0.61 0.06,-0.94 0,-0.32 -0.02,-0.64 -0.07,-0.94l2.03,-1.58c0.18,-0.14 0.23,-0.41 0.12,-0.61l-1.92,-3.32c-0.12,-0.22 -0.37,-0.29 -0.59,-0.22l-2.39,0.96c-0.5,-0.38 -1.03,-0.7 -1.62,-0.94L14.4,2.81c-0.04,-0.24 -0.24,-0.41 -0.48,-0.41h-3.84c-0.24,0 -0.43,0.17 -0.47,0.41L9.25,5.35C8.66,5.59 8.12,5.92 7.63,6.29L5.24,5.33c-0.22,-0.08 -0.47,0 -0.59,0.22L2.74,8.87c-0.12,0.21 -0.08,0.47 0.12,0.61l2.03,1.58c-0.05,0.3 -0.09,0.63 -0.09,0.94s0.02,0.64 0.07,0.94l-2.03,1.58c-0.18,0.14 -0.23,0.41 -0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39,-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.44,-0.17 0.47,-0.41l0.36,-2.54c0.59,-0.24 1.13,-0.56 1.62,-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59,-0.22l1.92,-3.32c0.12,-0.22 0.07,-0.47 -0.12,-0.61l-2.01,-1.58zM12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6 3.6,1.62 3.6,3.6 -1.62,3.6 -3.6,3.6z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_search_bar.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#1F2430"/>
              <corners android:radius="20dp"/>
              <stroke android:width="1dp" android:color="#30363D"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_poster_placeholder.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#21262D"/>
              <corners android:radius="8dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_tag.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#CC000000"/>
              <corners android:radius="4dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_circle_btn.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#901E1E1E"/>
              <corners android:radius="24dp"/>
              <stroke android:width="1dp" android:color="#40FFFFFF"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_gesture_indicator.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#D9161B22"/>
              <corners android:radius="12dp"/>
              <stroke android:width="1dp" android:color="#30363D"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_always_info.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#77000000"/>
              <corners android:radius="10dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_player_gradient.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
                  android:startColor="#B8000000"
                  android:centerColor="#00000000"
                  android:endColor="#D8000000"
                  android:angle="270"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/menu/bottom_nav_menu.xml
          <?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:id="@+id/nav_vod" android:icon="@drawable/ic_nav_vod" android:title="影视点播" />
              <item android:id="@+id/nav_live" android:icon="@drawable/ic_nav_live" android:title="电视直播" />
              <item android:id="@+id/nav_settings" android:icon="@drawable/ic_nav_settings" android:title="线路源仓" />
          </menu>
          EOF

          cat << 'EOF' > app/src/main/res/layout/item_search_suggestion.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="44dp"
              android:orientation="horizontal"
              android:gravity="center_vertical"
              android:paddingStart="14dp"
              android:paddingEnd="14dp"
              android:background="#161B22">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="🔍"
                  android:textSize="13sp"
                  android:layout_marginEnd="10dp"/>
              <TextView
                  android:id="@+id/tv_suggestion_text"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="1"
                  android:textColor="@color/white"
                  android:textSize="13sp"
                  android:singleLine="true"
                  android:ellipsize="end"/>
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="↖"
                  android:textColor="@color/text_muted"
                  android:textSize="14sp"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/bg_dark">

              <FrameLayout
                  android:id="@+id/player_container"
                  android:layout_width="match_parent"
                  android:layout_height="220dp"
                  android:background="@color/black">

                  <androidx.media3.ui.PlayerView
                      android:id="@+id/player_view"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      app:use_controller="false"
                      app:resize_mode="fit"/>

                  <ProgressBar
                      android:id="@+id/buffering_progress"
                      android:layout_width="44dp"
                      android:layout_height="44dp"
                      android:layout_gravity="center"
                      android:indeterminate="true"
                      android:visibility="gone"/>

                  <TextView
                      android:id="@+id/tv_always_info"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_gravity="top|end"
                      android:layout_margin="8dp"
                      android:background="@drawable/bg_always_info"
                      android:paddingStart="8dp"
                      android:paddingEnd="8dp"
                      android:paddingTop="3dp"
                      android:paddingBottom="3dp"
                      android:textColor="#EAEAEA"
                      android:textSize="11sp"
                      android:textStyle="bold"
                      android:text="🔋 100%  12:00 | 00:00 / 00:00"
                      android:visibility="visible"/>

                  <ProgressBar
                      android:id="@+id/always_mini_progress"
                      style="?android:attr/progressBarStyleHorizontal"
                      android:layout_width="match_parent"
                      android:layout_height="2.5dp"
                      android:layout_gravity="bottom"
                      android:max="1000"
                      android:progress="0"
                      android:progressTint="@color/primary_indigo"
                      android:visibility="visible"/>

                  <LinearLayout
                      android:id="@+id/layout_gesture_seek"
                      android:layout_width="160dp"
                      android:layout_height="wrap_content"
                      android:layout_gravity="center"
                      android:orientation="vertical"
                      android:gravity="center"
                      android:background="@drawable/bg_gesture_indicator"
                      android:padding="12dp"
                      android:visibility="gone">
                      <TextView android:id="@+id/tv_gesture_target_time" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="@color/white" android:textSize="16sp" android:textStyle="bold" android:text="00:15:30"/>
                      <TextView android:id="@+id/tv_gesture_delta_time" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="4dp" android:textColor="@color/primary_indigo" android:textSize="12sp" android:text="+00:30"/>
                  </LinearLayout>

                  <LinearLayout
                      android:id="@+id/layout_brightness_indicator"
                      android:layout_width="120dp"
                      android:layout_height="wrap_content"
                      android:layout_gravity="center"
                      android:orientation="vertical"
                      android:gravity="center"
                      android:background="@drawable/bg_gesture_indicator"
                      android:padding="12dp"
                      android:visibility="gone">
                      <TextView android:layout_width="wrap_content" android:layout_height="wrap_content" android:textSize="22sp" android:text="☀️"/>
                      <TextView android:id="@+id/tv_brightness_percent" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_marginTop="4dp" android:textColor="@color/white" android:textSize="14sp" android:textStyle="bold" android:text="50%"/>
                  </LinearLayout>

                  <TextView
                      android:id="@+id/btn_lock_screen"
                      android:layout_width="42dp"
                      android:layout_height="42dp"
                      android:layout_gravity="center_vertical|start"
                      android:layout_marginStart="14dp"
                      android:gravity="center"
                      android:textSize="18sp"
                      android:textColor="@color/white"
                      android:background="@drawable/bg_circle_btn"
                      android:text="🔓"
                      android:visibility="gone"/>

                  <LinearLayout
                      android:id="@+id/right_episodes_drawer"
                      android:layout_width="290dp"
                      android:layout_height="match_parent"
                      android:layout_gravity="end"
                      android:background="#E6161B22"
                      android:orientation="vertical"
                      android:padding="12dp"
                      android:clickable="true"
                      android:visibility="gone">
                      <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:gravity="center_vertical">
                          <TextView android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="选择分集" android:textColor="@color/white" android:textSize="14sp" android:textStyle="bold"/>
                          <TextView android:id="@+id/btn_close_right_drawer" android:layout_width="32dp" android:layout_height="32dp" android:gravity="center" android:text="✕" android:textColor="@color/text_muted" android:textSize="16sp"/>
                      </LinearLayout>
                      <HorizontalScrollView android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="6dp" android:scrollbars="none">
                          <com.google.android.material.chip.ChipGroup android:id="@+id/right_chip_group_sources" android:layout_width="wrap_content" android:layout_height="wrap_content" app:singleSelection="true"/>
                      </HorizontalScrollView>
                      <androidx.recyclerview.widget.RecyclerView android:id="@+id/right_recycler_episodes" android:layout_width="match_parent" android:layout_height="match_parent" android:layout_marginTop="8dp"/>
                  </LinearLayout>

                  <RelativeLayout
                      android:id="@+id/player_control_overlay"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:background="@drawable/bg_player_gradient"
                      android:visibility="visible">

                      <LinearLayout
                          android:id="@+id/top_control_bar"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:padding="10dp"
                          android:gravity="center_vertical">
                          <TextView android:id="@+id/tv_player_title" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:textColor="@color/white" android:textSize="13sp" android:textStyle="bold" android:ellipsize="end" android:maxLines="1" android:text="影视盒子 · 点击下方选片播放"/>
                          <TextView android:id="@+id/btn_cast_screen" android:layout_width="wrap_content" android:layout_height="28dp" android:paddingStart="8dp" android:paddingEnd="8dp" android:layout_marginEnd="6dp" android:gravity="center" android:textColor="@color/white" android:textSize="11sp" android:text="📡 投屏" android:background="@drawable/bg_circle_btn"/>
                          <TextView android:id="@+id/btn_player_settings" android:layout_width="wrap_content" android:layout_height="28dp" android:paddingStart="8dp" android:paddingEnd="8dp" android:layout_marginEnd="50dp" android:gravity="center" android:textColor="@color/white" android:textSize="11sp" android:text="⚙️ 设置" android:background="@drawable/bg_circle_btn"/>
                      </LinearLayout>

                      <LinearLayout
                          android:id="@+id/center_control_group"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_centerInParent="true"
                          android:orientation="horizontal"
                          android:gravity="center">
                          <TextView android:id="@+id/btn_prev_ep" android:layout_width="40dp" android:layout_height="40dp" android:gravity="center" android:textColor="@color/white" android:textSize="18sp" android:textStyle="bold" android:text="⏮" android:background="@drawable/bg_circle_btn"/>
                          <TextView android:id="@+id/btn_rewind_10" android:layout_width="44dp" android:layout_height="44dp" android:layout_marginStart="14dp" android:gravity="center" android:textColor="@color/white" android:textSize="12sp" android:textStyle="bold" android:text="-10s" android:background="@drawable/bg_circle_btn"/>
                          <TextView android:id="@+id/btn_center_play" android:layout_width="52dp" android:layout_height="52dp" android:layout_marginStart="14dp" android:gravity="center" android:textColor="@color/white" android:textSize="22sp" android:text="⏸" android:background="@drawable/bg_circle_btn"/>
                          <TextView android:id="@+id/btn_forward_10" android:layout_width="44dp" android:layout_height="44dp" android:layout_marginStart="14dp" android:gravity="center" android:textColor="@color/white" android:textSize="12sp" android:textStyle="bold" android:text="+10s" android:background="@drawable/bg_circle_btn"/>
                          <TextView android:id="@+id/btn_next_ep" android:layout_width="40dp" android:layout_height="40dp" android:layout_marginStart="14dp" android:gravity="center" android:textColor="@color/white" android:textSize="18sp" android:textStyle="bold" android:text="⏭" android:background="@drawable/bg_circle_btn"/>
                      </LinearLayout>

                      <LinearLayout
                          android:id="@+id/bottom_control_bar"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_alignParentBottom="true"
                          android:orientation="horizontal"
                          android:gravity="center_vertical"
                          android:paddingStart="10dp"
                          android:paddingEnd="10dp"
                          android:paddingBottom="6dp">
                          <TextView android:id="@+id/tv_combined_time" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="@color/white" android:textSize="11sp" android:text="00:00 / 00:00"/>
                          <SeekBar android:id="@+id/player_seek_bar" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:max="1000" android:progress="0"/>
                          <TextView android:id="@+id/btn_episodes_sheet" android:layout_width="38dp" android:layout_height="28dp" android:gravity="center" android:textColor="@color/white" android:textSize="11sp" android:text="选集" android:background="@drawable/bg_circle_btn"/>
                          <TextView android:id="@+id/btn_quality_switch" android:layout_width="44dp" android:layout_height="28dp" android:layout_marginStart="4dp" android:gravity="center" android:textColor="@color/white" android:textSize="10sp" android:textStyle="bold" android:text="1080P" android:background="@drawable/bg_circle_btn"/>
                          <TextView android:id="@+id/btn_aspect_ratio" android:layout_width="38dp" android:layout_height="28dp" android:layout_marginStart="4dp" android:gravity="center" android:textColor="@color/white" android:textSize="10sp" android:textStyle="bold" android:text="比例" android:background="@drawable/bg_circle_btn"/>
                          <TextView android:id="@+id/btn_speed_switch" android:layout_width="38dp" android:layout_height="28dp" android:layout_marginStart="4dp" android:gravity="center" android:textColor="@color/white" android:textSize="11sp" android:textStyle="bold" android:text="1.0x" android:background="@drawable/bg_circle_btn"/>
                          <TextView android:id="@+id/btn_fullscreen" android:layout_width="38dp" android:layout_height="28dp" android:layout_marginStart="4dp" android:gravity="center" android:textColor="@color/white" android:textSize="11sp" android:text="全屏" android:background="@drawable/bg_circle_btn"/>
                      </LinearLayout>
                  </RelativeLayout>
              </FrameLayout>

