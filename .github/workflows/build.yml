              private void showListDialog(String title, String jsonStr, boolean isHistory) {
                  BottomSheetDialog dialog = new BottomSheetDialog(this);
                  View v = LayoutInflater.from(this).inflate(R.layout.dialog_episodes, null);
                  ((TextView) v.findViewById(R.id.tv_episode_sheet_title)).setText(title);
                  v.findViewById(R.id.chip_group_sources).setVisibility(View.GONE);

                  RecyclerView rv = v.findViewById(R.id.recycler_episodes);
                  rv.setLayoutManager(new LinearLayoutManager(this));

                  List<JSONObject> list = new ArrayList<>();
                  try {
                      JSONArray arr = new JSONArray(jsonStr);
                      for (int i = 0; i < arr.length(); i++) list.add(arr.getJSONObject(i));
                  } catch (Exception ignored) {}

                  rv.setAdapter(new RecyclerView.Adapter<RecyclerView.ViewHolder>() {
                      @NonNull @Override public RecyclerView.ViewHolder onCreateViewHolder(@NonNull ViewGroup p, int vt) {
                          View itemV = LayoutInflater.from(p.getContext()).inflate(R.layout.item_history_fav, p, false);
                          return new RecyclerView.ViewHolder(itemV) {};
                      }
                      @Override public void onBindViewHolder(@NonNull RecyclerView.ViewHolder holder, int pos) {
                          JSONObject o = list.get(pos);
                          TextView tvT = holder.itemView.findViewById(R.id.tv_title);
                          TextView tvD = holder.itemView.findViewById(R.id.tv_desc);
                          ImageView iv = holder.itemView.findViewById(R.id.iv_thumb);

                          tvT.setText(o.optString("name"));
                          tvD.setText(isHistory ? ("上次播放: " + o.optString("epTitle")) : o.optString("remarks"));
