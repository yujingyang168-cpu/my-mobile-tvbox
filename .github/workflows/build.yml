name: Build and Auto Release Mobile TVBox
on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - 'version.json'
      - 'README.md'
      - 'app/release.keystore'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      # 步骤 1：生成配置、密钥与界面布局文件
      - name: Setup Android Project Configuration
        env:
          RUN_NUM: ${{ github.run_number }}
        run: |
          mkdir -p app/src/main/java/com/mobile/tvbox
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/menu
          mkdir -p app/src/main/res/xml

          # 永久专属签名密钥检测与生成
          if [ ! -f app/release.keystore ]; then
            keytool -genkeypair -v -keystore app/release.keystore \
              -alias tvbox \
              -keyalg RSA \
              -keysize 2048 \
              -validity 36500 \
              -storepass tvbox123456 \
              -keypass tvbox123456 \
              -dname "CN=MobileTVBox, OU=App, O=TVBox, L=City, ST=Province, C=CN"
          fi

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "MobileTVBox"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.mobile.tvbox'
              compileSdk 34
              defaultConfig {
                  applicationId "com.mobile.tvbox"
                  minSdk 24
                  targetSdk 34
                  versionCode $((100 + RUN_NUM))
                  versionName "2.${RUN_NUM}"
              }
              signingConfigs {
                  release {
                      storeFile file('release.keystore')
                      storePassword 'tvbox123456'
                      keyAlias 'tvbox'
                      keyPassword 'tvbox123456'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.release
                  }
                  release {
                      minifyEnabled false
                      signingConfig signingConfigs.release
                  }
              }
              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.media3:media3-datasource:1.2.1'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'com.github.bumptech.glide:glide:4.16.0'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
          }
          EOF

          cat << 'EOF' > app/src/main/res/xml/file_paths.xml
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
              <external-files-path name="apk_downloads" path="." />
              <external-path name="external_storage_root" path="." />
              <external-files-path name="update" path="update/" />
          </paths>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">影视盒子</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
              <color name="bg_light">#F5F7FB</color>
              <color name="bg_dark">#0E1117</color>
              <color name="card_dark">#161B22</color>
              <color name="card_stroke">#30363D</color>
              <color name="primary_blue">#2979FF</color>
              <color name="accent_orange">#FF9100</color>
              <color name="accent_purple">#7C4DFF</color>
              <color name="text_main">#212121</color>
              <color name="text_sub">#757575</color>
              <color name="text_muted">#8B949E</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.MobileTVBox" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/primary_blue</item>
                  <item name="android:statusBarColor">@color/black</item>
                  <item name="android:navigationBarColor">@color/white</item>
              </style>
          </resources>
          EOF

          # 图标与图形资源
          cat << 'EOF' > app/src/main/res/drawable/ic_app_icon.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0B0E14" android:pathData="M0,0h108v108h-108z"/>
              <path android:strokeColor="#30363D" android:strokeWidth="1.5" android:fillColor="#00000000" android:pathData="M54,12 A42,42 0 1,1 53.9,12 Z"/>
              <path android:fillColor="#1F2430" android:pathData="M54,20 L84,37 L84,71 L54,88 L24,71 L24,37 Z"/>
              <path android:fillColor="#2979FF" android:pathData="M54,54 L24,37 L54,20 L54,54 Z"/>
              <path android:fillColor="#7C4DFF" android:pathData="M54,54 L54,20 L84,37 L54,54 Z"/>
              <path android:fillColor="#FF9100" android:pathData="M48,42 L66,54 L48,66 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_poster_placeholder.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#21262D"/>
              <corners android:radius="8dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_nav_home.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#2979FF" android:pathData="M10,20v-6h4v6h5v-8h3L12,3 2,12h3v8z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_nav_tv.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#2979FF" android:pathData="M21,3H3c-1.1,0 -2,0.9 -2,2v12c0,1.1 0.9,2 2,2h5v2h8v-2h5c1.1,0 2,-0.9 2,-2V5c0,-1.1 -0.9,-2 -2,-2zm0,14H3V5h18v12zm-11,-2l6,-4l-6,-4v8z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_nav_mine.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#2979FF" android:pathData="M12,2C6.48,2 2,6.48 2,12s4.48,10 10,10 10,-4.48 10,-10S17.52,2 12,2zm0,3c1.66,0 3,1.34 3,3s-1.34,3 -3,3 -3,-1.34 -3,-3 1.34,-3 3,-3zm0,14.2c-2.5,0 -4.71,-1.28 -6,-3.22 0.03,-1.99 4,-3.08 6,-3.08 1.99,0 5.97,1.09 6,3.08 -1.29,1.94 -3.5,3.22 -6,3.22z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_profile_header.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient android:startColor="#8BC8FF" android:centerColor="#BCE0FD" android:endColor="#F5F7FB" android:angle="270"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_avatar_circle.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#3FA4FC"/>
              <corners android:radius="45dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_card_white.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#FFFFFF"/>
              <corners android:radius="14dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_search_input.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#EDF2F9"/>
              <corners android:radius="18dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_filter_pill_selected.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#2979FF"/>
              <corners android:radius="8dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_filter_pill_normal.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#455A64"/>
              <corners android:radius="8dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_player_glass_btn.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#8021262D"/>
              <corners android:radius="18dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_player_gradient.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient android:startColor="#B8000000" android:centerColor="#00000000" android:endColor="#D8000000" android:angle="270"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_score_tag.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#B3000000"/>
              <corners android:radius="4dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_gesture_indicator.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#D9161B22"/>
              <corners android:radius="12dp"/>
              <stroke android:width="1dp" android:color="#30363D"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_pill_border_blue.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#F0F7FF"/>
              <corners android:radius="8dp"/>
              <stroke android:width="1.5dp" android:color="#2979FF"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_pill_gray.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#F5F5F5"/>
              <corners android:radius="8dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/menu/bottom_nav_menu.xml
          <?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android">
              <item android:id="@+id/nav_vod" android:icon="@drawable/ic_nav_home" android:title="首页" />
              <item android:id="@+id/nav_live" android:icon="@drawable/ic_nav_tv" android:title="电视" />
              <item android:id="@+id/nav_mine" android:icon="@drawable/ic_nav_mine" android:title="我的" />
          </menu>
          EOF

          # 3列海报卡片
          cat << 'EOF' > app/src/main/res/layout/item_vod_card.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:padding="4dp">
              <FrameLayout
                  android:layout_width="match_parent"
                  android:layout_height="150dp">
                  <ImageView
                      android:id="@+id/iv_vod_poster"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:scaleType="centerCrop"
                      android:background="@drawable/bg_poster_placeholder"/>
                  <TextView
                      android:id="@+id/tv_vod_score"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_gravity="bottom|start"
                      android:layout_margin="5dp"
                      android:background="@drawable/bg_score_tag"
                      android:paddingStart="5dp"
                      android:paddingEnd="5dp"
                      android:paddingTop="2dp"
                      android:paddingBottom="2dp"
                      android:textColor="#FFB300"
                      android:textSize="10sp"
                      android:textStyle="bold"
                      android:text="评分: 7.8"/>
              </FrameLayout>
              <TextView
                  android:id="@+id/tv_vod_title"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="5dp"
                  android:ellipsize="end"
                  android:maxLines="1"
                  android:textColor="#333333"
                  android:textSize="12sp"
                  android:textStyle="bold"
                  android:text="影片标题"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/item_history_fav.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="72dp"
              android:orientation="horizontal"
              android:gravity="center_vertical"
              android:padding="8dp"
              android:layout_marginBottom="6dp"
              android:background="@drawable/bg_card_white">
              <ImageView
                  android:id="@+id/iv_thumb"
                  android:layout_width="50dp"
                  android:layout_height="match_parent"
                  android:scaleType="centerCrop"
                  android:background="@drawable/bg_poster_placeholder"/>
              <LinearLayout
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="1"
                  android:layout_marginStart="10dp"
                  android:orientation="vertical">
                  <TextView
                      android:id="@+id/tv_title"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:textColor="#212121"
                      android:textSize="13sp"
                      android:textStyle="bold"
                      android:singleLine="true"
                      android:text="影片标题"/>
                  <TextView
                      android:id="@+id/tv_desc"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="4dp"
                      android:textColor="#757575"
                      android:textSize="11sp"
                      android:text="观看至 12:45"/>
              </LinearLayout>
              <TextView
                  android:id="@+id/btn_action"
                  android:layout_width="wrap_content"
                  android:layout_height="28dp"
                  android:paddingStart="10dp"
                  android:paddingEnd="10dp"
                  android:gravity="center"
                  android:background="@drawable/bg_search_input"
                  android:textColor="@color/primary_blue"
                  android:textSize="11sp"
                  android:text="查看"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/item_search_suggestion.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="42dp"
              android:orientation="horizontal"
              android:gravity="center_vertical"
              android:paddingStart="14dp"
              android:paddingEnd="14dp"
              android:background="#FFFFFF">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="🔍"
                  android:textSize="12sp"
                  android:layout_marginEnd="10dp"/>
              <TextView
                  android:id="@+id/tv_suggestion_text"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="1"
                  android:textColor="#333333"
                  android:textSize="13sp"
                  android:singleLine="true"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/item_live_channel.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:gravity="center_vertical"
              android:padding="12dp"
              android:layout_marginBottom="4dp"
              android:background="@drawable/bg_card_white">
              <TextView android:id="@+id/tv_live_num" android:layout_width="32dp" android:layout_height="wrap_content" android:textColor="#757575" android:textSize="13sp" android:textStyle="bold" android:text="01"/>
              <LinearLayout android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:orientation="vertical">
                  <TextView android:id="@+id/tv_live_name" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#212121" android:textSize="14sp" android:textStyle="bold" android:text="CCTV-1 综合"/>
                  <TextView android:id="@+id/tv_live_group" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="#757575" android:textSize="11sp" android:text="央视频道"/>
              </LinearLayout>
              <TextView android:id="@+id/tv_live_indicator" android:layout_width="wrap_content" android:layout_height="wrap_content" android:textColor="@color/primary_blue" android:textSize="12sp" android:text="正在播放" android:visibility="gone"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/dialog_episodes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:background="#161B22"
              android:padding="16dp">
              <TextView android:id="@+id/tv_episode_sheet_title" android:layout_width="match_parent" android:layout_height="wrap_content" android:textColor="@color/white" android:textSize="15sp" android:textStyle="bold" android:text="选择播放集数"/>
              <HorizontalScrollView android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_marginTop="8dp" android:scrollbars="none">
                  <com.google.android.material.chip.ChipGroup android:id="@+id/chip_group_sources" android:layout_width="wrap_content" android:layout_height="wrap_content" app:singleSelection="true"/>
              </HorizontalScrollView>
              <androidx.recyclerview.widget.RecyclerView android:id="@+id/recycler_episodes" android:layout_width="match_parent" android:layout_height="260dp" android:layout_marginTop="8dp"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/item_episode_btn.xml
          <?xml version="1.0" encoding="utf-8"?>
          <Button xmlns:android="http://schemas.android.com/apk/res/android" android:id="@+id/btn_episode_item" android:layout_width="match_parent" android:layout_height="40dp" android:layout_margin="3dp" android:textSize="11sp" android:textColor="@color/white" android:backgroundTint="#21262D" android:text="01"/>
          EOF

          # 主界面布局
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/bg_light">
              <!-- 主内容容器（三大独立Tab界面） -->
              <FrameLayout
                  android:id="@+id/content_container"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_above="@id/bottom_nav">
                  <!-- 页面 1：首页海报流 -->
                  <LinearLayout
                      android:id="@+id/layout_vod"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:orientation="vertical">
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="48dp"
                          android:orientation="horizontal"
                          android:gravity="center_vertical"
                          android:paddingStart="12dp"
                          android:paddingEnd="12dp"
                          android:background="#FFFFFF">
                          <TextView
                              android:id="@+id/btn_switch_vod_source"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="🐮【王二小... ▼"
                              android:textSize="13sp"
                              android:textStyle="bold"
                              android:textColor="#333333"/>
                          <EditText
                              android:id="@+id/et_search"
                              android:layout_width="0dp"
                              android:layout_height="34dp"
                              android:layout_weight="1"
                              android:layout_marginStart="10dp"
                              android:layout_marginEnd="10dp"
                              android:background="@drawable/bg_search_input"
                              android:hint="🔍 搜索"
                              android:textColorHint="#9E9E9E"
                              android:textColor="#333333"
                              android:paddingStart="12dp"
                              android:paddingEnd="12dp"
                              android:textSize="12sp"
                              android:imeOptions="actionSearch"
                              android:inputType="text"/>
                          <TextView
                              android:id="@+id/btn_home_history"
                              android:layout_width="30dp"
                              android:layout_height="30dp"
                              android:gravity="center"
                              android:text="🕒"
                              android:textSize="16sp"/>
                      </LinearLayout>
                      <HorizontalScrollView
                          android:layout_width="match_parent"
                          android:layout_height="40dp"
                          android:scrollbars="none"
                          android:background="#FFFFFF"
                          android:paddingStart="8dp"
                          android:paddingEnd="8dp">
                          <com.google.android.material.chip.ChipGroup
                              android:id="@+id/chip_group_main_types"
                              android:layout_width="wrap_content"
                              android:layout_height="match_parent"
                              app:singleSelection="true"/>
                      </HorizontalScrollView>
                      <!-- 4 行筛选矩阵 -->
                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical"
                          android:background="#FFFFFF"
                          android:paddingBottom="6dp">
                          <HorizontalScrollView android:layout_width="match_parent" android:layout_height="32dp" android:scrollbars="none" android:paddingStart="8dp" android:paddingEnd="8dp">
                              <com.google.android.material.chip.ChipGroup android:id="@+id/chip_group_row1_type" android:layout_width="wrap_content" android:layout_height="match_parent" app:singleSelection="true"/>
                          </HorizontalScrollView>
                          <HorizontalScrollView android:layout_width="match_parent" android:layout_height="32dp" android:layout_marginTop="3dp" android:scrollbars="none" android:paddingStart="8dp" android:paddingEnd="8dp">
                              <com.google.android.material.chip.ChipGroup android:id="@+id/chip_group_row2_area" android:layout_width="wrap_content" android:layout_height="match_parent" app:singleSelection="true"/>
                          </HorizontalScrollView>
                          <HorizontalScrollView android:layout_width="match_parent" android:layout_height="32dp" android:layout_marginTop="3dp" android:scrollbars="none" android:paddingStart="8dp" android:paddingEnd="8dp">
                              <com.google.android.material.chip.ChipGroup android:id="@+id/chip_group_row3_sort" android:layout_width="wrap_content" android:layout_height="match_parent" app:singleSelection="true"/>
