name: Build Mobile TVBox APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Generate Mobile TVBox Project
        run: |
          mkdir -p app/src/main/java/com/mobile/tvbox
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/menu

          # 1. Gradle 基础配置
          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url 'https://jitpack.io' }
              }
          }
          rootProject.name = "MobileTVBox"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.mobile.tvbox'
              compileSdk 34

              defaultConfig {
                  applicationId "com.mobile.tvbox"
                  minSdk 24
                  targetSdk 34
                  versionCode 4
                  versionName "1.3"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              lint {
                  abortOnError false
                  checkReleaseBuilds false
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'androidx.media3:media3-exoplayer:1.2.1'
              implementation 'androidx.media3:media3-exoplayer-hls:1.2.1'
              implementation 'androidx.media3:media3-ui:1.2.1'
              implementation 'androidx.media3:media3-datasource:1.2.1'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
              implementation 'com.github.bumptech.glide:glide:4.16.0'
              implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
          }
          EOF

          # 2. 界面与样式资源
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">影视盒子</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/colors.xml
          <resources>
              <color name="black">#000000</color>
              <color name="white">#FFFFFF</color>
              <color name="bg_dark">#0E1117</color>
              <color name="card_dark">#161B22</color>
              <color name="card_stroke">#30363D</color>
              <color name="primary_indigo">#6366F1</color>
              <color name="accent_purple">#8B5CF6</color>
              <color name="text_muted">#8B949E</color>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.MobileTVBox" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">@color/primary_indigo</item>
                  <item name="android:statusBarColor">@color/black</item>
                  <item name="android:navigationBarColor">@color/card_dark</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_app_icon.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#0B0E14" android:pathData="M0,0h108v108h-108z"/>
              <path android:strokeColor="#30363D" android:strokeWidth="1.5" android:fillColor="#00000000" android:pathData="M54,12 A42,42 0 1,1 53.9,12 Z"/>
              <path android:fillColor="#1F2430" android:pathData="M54,20 L84,37 L84,71 L54,88 L24,71 L24,37 Z"/>
              <path android:fillColor="#4F46E5" android:pathData="M54,54 L24,37 L54,20 L54,54 Z"/>
              <path android:fillColor="#7C3AED" android:pathData="M54,54 L54,20 L84,37 L54,54 Z"/>
              <path android:fillColor="#F59E0B" android:pathData="M48,42 L66,54 L48,66 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_search_bar.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#1F2430"/>
              <corners android:radius="20dp"/>
              <stroke android:width="1dp" android:color="#30363D"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_poster_placeholder.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#21262D"/>
              <corners android:radius="8dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_tag.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#CC000000"/>
              <corners android:radius="4dp"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_circle_btn.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#901E1E1E"/>
              <corners android:radius="24dp"/>
              <stroke android:width="1dp" android:color="#40FFFFFF"/>
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_player_gradient.xml
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <gradient
                  android:startColor="#B8000000"
                  android:centerColor="#00000000"
                  android:endColor="#D8000000"
                  android:angle="270"/>
          </shape>
          EOF

          # 3. 菜单与主界面布局
          cat << 'EOF' > app/src/main/res/menu/bottom_nav_menu.xml
          <?xml version="1.0" encoding="utf-8"?>
          <menu xmlns:android="http://schemas.android.com/apk/res/android">
              <item
                  android:id="@+id/nav_vod"
                  android:icon="@android:drawable/ic_menu_slideshow"
                  android:title="影视点播" />
              <item
                  android:id="@+id/nav_live"
                  android:icon="@android:drawable/ic_media_play"
                  android:title="电视直播" />
              <item
                  android:id="@+id/nav_settings"
                  android:icon="@android:drawable/ic_menu_preferences"
                  android:title="线路源仓" />
          </menu>
          EOF

          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:app="http://schemas.android.com/apk/res-auto"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@color/bg_dark">

              <!-- 播放器主容器 -->
              <FrameLayout
                  android:id="@+id/player_container"
                  android:layout_width="match_parent"
                  android:layout_height="220dp"
                  android:background="@color/black">

                  <androidx.media3.ui.PlayerView
                      android:id="@+id/player_view"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      app:use_controller="false"
                      app:resize_mode="fit"/>

                  <ProgressBar
                      android:id="@+id/buffering_progress"
                      android:layout_width="44dp"
                      android:layout_height="44dp"
                      android:layout_gravity="center"
                      android:indeterminate="true"
                      android:visibility="gone"/>

                  <!-- 防误触屏幕锁按钮（常驻左侧独立层） -->
                  <TextView
                      android:id="@+id/btn_lock_screen"
                      android:layout_width="42dp"
                      android:layout_height="42dp"
                      android:layout_gravity="center_vertical|start"
                      android:layout_marginStart="14dp"
                      android:gravity="center"
                      android:textSize="18sp"
                      android:textColor="@color/white"
                      android:background="@drawable/bg_circle_btn"
                      android:text="🔓"
                      android:visibility="gone"/>

                  <!-- 交互控制层 -->
                  <RelativeLayout
                      android:id="@+id/player_control_overlay"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:background="@drawable/bg_player_gradient"
                      android:visibility="visible">

                      <!-- 顶部标题、设置与手机时间 -->
                      <LinearLayout
                          android:id="@+id/top_control_bar"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:padding="10dp"
                          android:gravity="center_vertical">

                          <TextView
                              android:id="@+id/tv_player_title"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:textColor="@color/white"
                              android:textSize="13sp"
                              android:textStyle="bold"
                              android:ellipsize="end"
                              android:maxLines="1"
                              android:text="影视盒子 · 点击下方选片播放"/>

                          <!-- 播放设置：跳过片头片尾、画面比例、时间显隐 -->
                          <TextView
                              android:id="@+id/btn_player_settings"
                              android:layout_width="wrap_content"
                              android:layout_height="28dp"
                              android:paddingStart="8dp"
                              android:paddingEnd="8dp"
                              android:gravity="center"
                              android:textColor="@color/white"
                              android:textSize="11sp"
                              android:text="⚙️ 设置"
                              android:background="@drawable/bg_circle_btn"/>

                          <!-- 手机系统时间 -->
                          <TextView
                              android:id="@+id/tv_system_time"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginStart="8dp"
                              android:textColor="#E0E0E0"
                              android:textSize="12sp"
                              android:textStyle="bold"
                              android:text="12:00"/>
                      </LinearLayout>

                      <!-- 中间快捷控制组 -->
                      <LinearLayout
                          android:id="@+id/center_control_group"
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:layout_centerInParent="true"
                          android:orientation="horizontal"
                          android:gravity="center">

                          <TextView
                              android:id="@+id/btn_prev_ep"
                              android:layout_width="40dp"
                              android:layout_height="40dp"
                              android:gravity="center"
                              android:textColor="@color/white"
                              android:textSize="18sp"
                              android:textStyle="bold"
                              android:text="⏮"
                              android:background="@drawable/bg_circle_btn"/>

                          <TextView
                              android:id="@+id/btn_rewind_10"
                              android:layout_width="44dp"
                              android:layout_height="44dp"
                              android:layout_marginStart="14dp"
                              android:gravity="center"
                              android:textColor="@color/white"
                              android:textSize="12sp"
                              android:textStyle="bold"
                              android:text="-10s"
                              android:background="@drawable/bg_circle_btn"/>

                          <TextView
                              android:id="@+id/btn_center_play"
                              android:layout_width="52dp"
                              android:layout_height="52dp"
                              android:layout_marginStart="14dp"
                              android:gravity="center"
                              android:textColor="@color/white"
                              android:textSize="22sp"
                              android:text="⏸"
                              android:background="@drawable/bg_circle_btn"/>

                          <TextView
                              android:id="@+id/btn_forward_10"
                              android:layout_width="44dp"
                              android:layout_height="44dp"
                              android:layout_marginStart="14dp"
                              android:gravity="center"
                              android:textColor="@color/white"
                              android:textSize="12sp"
                              android:textStyle="bold"
                              android:text="+10s"
                              android:background="@drawable/bg_circle_btn"/>

                          <TextView
                              android:id="@+id/btn_next_ep"
                              android:layout_width="40dp"
                              android:layout_height="40dp"
                              android:layout_marginStart="14dp"
                              android:gravity="center"
                              android:textColor="@color/white"
                              android:textSize="18sp"
                              android:textStyle="bold"
                              android:text="⏭"
                              android:background="@drawable/bg_circle_btn"/>
                      </LinearLayout>

                      <!-- 底部进度条与功能栏 -->
                      <LinearLayout
                          android:id="@+id/bottom_control_bar"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_alignParentBottom="true"
                          android:orientation="horizontal"
                          android:gravity="center_vertical"
                          android:paddingStart="10dp"
                          android:paddingEnd="10dp"
                          android:paddingBottom="6dp">

                          <!-- 进度条：当前播放时长 / 总时长 模式 -->
                          <TextView
                              android:id="@+id/tv_combined_time"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:textColor="@color/white"
                              android:textSize="11sp"
                              android:text="00:00 / 00:00"/>

                          <SeekBar
                              android:id="@+id/player_seek_bar"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              android:max="1000"
                              android:progress="0"/>

                          <!-- 选集按钮：直接弹出任意集数选择 -->
                          <TextView
                              android:id="@+id/btn_episodes_sheet"
                              android:layout_width="42dp"
                              android:layout_height="28dp"
                              android:gravity="center"
                              android:textColor="@color/white"
                              android:textSize="11sp"
                              android:text="选集"
                              android:background="@drawable/bg_circle_btn"/>

                          <!-- 倍速切换 -->
                          <TextView
                              android:id="@+id/btn_speed_switch"
                              android:layout_width="42dp"
                              android:layout_height="28dp"
                              android:layout_marginStart="6dp"
                              android:gravity="center"
                              android:textColor="@color/white"
                              android:textSize="11sp"
                              android:textStyle="bold"
                              android:text="1.0x"
                              android:background="@drawable/bg_circle_btn"/>

                          <!-- 全屏切换 -->
                          <TextView
                              android:id="@+id/btn_fullscreen"
                              android:layout_width="42dp"
                              android:layout_height="28dp"
                              android:layout_marginStart="6dp"
                              android:gravity="center"
                              android:textColor="@color/white"
                              android:textSize="11sp"
                              android:text="全屏"
                              android:background="@drawable/bg_circle_btn"/>
                      </LinearLayout>
                  </RelativeLayout>
              </FrameLayout>

              <!-- 中部内容容器 -->
              <FrameLayout
                  android:id="@+id/content_container"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_below="@id/player_container"
                  android:layout_above="@id/bottom_nav">

                  <LinearLayout
                      android:id="@+id/layout_vod"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:orientation="vertical">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:gravity="center_vertical"
                          android:padding="8dp">

                          <Button
                              android:id="@+id/btn_switch_vod_source"
                              android:layout_width="wrap_content"
                              android:layout_height="38dp"
                              android:text="线路: 量子极速 ▼"
                              android:textSize="12sp"
                              android:textColor="@color/white"
                              android:backgroundTint="#21262D"/>

                          <EditText
                              android:id="@+id/et_search"
                              android:layout_width="0dp"
                              android:layout_height="38dp"
                              android:layout_weight="1"
                              android:layout_marginStart="8dp"
                              android:background="@drawable/bg_search_bar"
                              android:hint="搜片名、剧集..."
                              android:textColorHint="@color/text_muted"
                              android:textColor="@color/white"
                              android:paddingStart="12dp"
                              android:paddingEnd="12dp"
                              android:textSize="13sp"
                              android:imeOptions="actionSearch"
                              android:inputType="text"/>
                      </LinearLayout>

                      <androidx.swiperefreshlayout.widget.SwipeRefreshLayout
                          android:id="@+id/swipe_vod"
                          android:layout_width="match_parent"
                          android:layout_height="match_parent">

                          <androidx.recyclerview.widget.RecyclerView
                              android:id="@+id/recycler_vod"
                              android:layout_width="match_parent"
                              android:layout_height="match_parent"
                              android:padding="6dp"/>
                      </androidx.swiperefreshlayout.widget.SwipeRefreshLayout>
                  </LinearLayout>

                  <LinearLayout
                      android:id="@+id/layout_live"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:orientation="vertical"
                      android:visibility="gone">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="horizontal"
                          android:gravity="center_vertical"
                          android:padding="8dp">

                          <com.google.android.material.chip.ChipGroup
                              android:id="@+id/chip_group_live"
                              android:layout_width="0dp"
                              android:layout_height="wrap_content"
                              android:layout_weight="1"
                              app:singleSelection="true">
                              <com.google.android.material.chip.Chip
                                  android:id="@+id/chip_live_all"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="全部"
                                  android:checked="true"
                                  style="@style/Widget.MaterialComponents.Chip.Choice"/>
                              <com.google.android.material.chip.Chip
                                  android:id="@+id/chip_live_cctv"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="央视"
                                  style="@style/Widget.MaterialComponents.Chip.Choice"/>
                              <com.google.android.material.chip.Chip
                                  android:id="@+id/chip_live_satellite"
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="卫视"
                                  style="@style/Widget.MaterialComponents.Chip.Choice"/>
                          </com.google.android.material.chip.ChipGroup>

                          <Button
                              android:id="@+id/btn_update_live_source"
                              android:layout_width="wrap_content"
                              android:layout_height="36dp"
                              android:text="更新源"
                              android:textSize="11sp"
                              android:textColor="@color/white"
                              android:backgroundTint="@color/primary_indigo"/>
                      </LinearLayout>

                      <androidx.recyclerview.widget.RecyclerView
                          android:id="@+id/recycler_live"
                          android:layout_width="match_parent"
                          android:layout_height="match_parent"
                          android:padding="6dp"/>
                  </LinearLayout>

                  <ScrollView
                      android:id="@+id/layout_settings"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:padding="16dp"
                      android:visibility="gone">

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:orientation="vertical">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="点播线路源配置"
                              android:textColor="@color/white"
                              android:textSize="16sp"
                              android:textStyle="bold"/>

                          <TextView
                              android:id="@+id/tv_current_vod_info"
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="6dp"
                              android:textColor="@color/text_muted"
                              android:textSize="13sp"
                              android:text="当前已载入: 量子极速专线"/>

                          <Button
                              android:id="@+id/btn_cfg_switch_vod"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="10dp"
                              android:text="选择切换点播源 (饭太硬/王二小/肥猫等)"
                              android:backgroundTint="#21262D"/>

                          <View
                              android:layout_width="match_parent"
                              android:layout_height="1dp"
                              android:layout_marginTop="16dp"
                              android:layout_marginBottom="16dp"
                              android:background="#30363D"/>

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="直播线路配置 (IPv4 / IPv6)"
                              android:textColor="@color/white"
                              android:textSize="16sp"
                              android:textStyle="bold"/>

                          <Button
                              android:id="@+id/btn_cfg_switch_live"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="10dp"
                              android:text="切换直播源 / 导入外部订阅"
                              android:backgroundTint="#21262D"/>
                      </LinearLayout>
                  </ScrollView>
              </FrameLayout>

              <!-- 底部导航栏 -->
              <com.google.android.material.bottomnavigation.BottomNavigationView
                  android:id="@+id/bottom_nav"
                  android:layout_width="match_parent"
                  android:layout_height="56dp"
                  android:layout_alignParentBottom="true"
                  android:background="#12161F"
                  app:itemIconTint="@color/white"
                  app:itemTextColor="@color/white"
                  app:menu="@menu/bottom_nav_menu"/>
          </RelativeLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/item_vod_card.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:padding="4dp">

              <FrameLayout
                  android:layout_width="match_parent"
                  android:layout_height="210dp">

                  <ImageView
                      android:id="@+id/iv_vod_poster"
                      android:layout_width="match_parent"
                      android:layout_height="match_parent"
                      android:scaleType="centerCrop"
                      android:background="@drawable/bg_poster_placeholder"/>

                  <TextView
                      android:id="@+id/tv_vod_remarks"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_gravity="bottom|end"
                      android:layout_margin="6dp"
                      android:background="@drawable/bg_tag"
                      android:paddingLeft="6dp"
                      android:paddingRight="6dp"
                      android:paddingTop="2dp"
                      android:paddingBottom="2dp"
                      android:textColor="@color/white"
                      android:textSize="10sp"
                      android:text="HD"/>
              </FrameLayout>

              <TextView
                  android:id="@+id/tv_vod_title"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="4dp"
                  android:ellipsize="end"
                  android:maxLines="1"
                  android:textColor="@color/white"
                  android:textSize="13sp"
                  android:textStyle="bold"
                  android:text="片名"/>
          </LinearLayout>
          EOF

          cat << 'EOF' > app/src/main/res/layout/item_live_channel.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="horizontal"
              android:gravity="center_vertical"
              android:padding="12dp"
              android:layout_marginBottom="4dp"
              android:background="#161B22">

              <TextView
                  android:id="@+id/tv_live_num"
                  android:layout_width="32dp"
                  android:layout_height="wrap_content"
                  android:textColor="@color/text_muted"
                  android:textSize="13sp"
                  android:textStyle="bold"
                  android:text="01"/>

