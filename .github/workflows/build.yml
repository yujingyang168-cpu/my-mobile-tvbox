              private void loadVodData(String keyword, String typeId) {
                  swipeVod.setRefreshing(true);
                  VodRoute route = vodRoutes.get(currentVodRouteIndex);
                  btnSwitchVodSource.setText(route.name + " ▼");

                  String url = route.api + "?ac=videolist";
                  if (typeId != null && !typeId.isEmpty()) url += "&t=" + typeId;
                  else if (keyword != null && !keyword.isEmpty()) url += "&wd=" + keyword;
                  else url += "&pg=1";

                  httpClient.newCall(new Request.Builder().url(url).build()).enqueue(new Callback() {
                      @Override public void onFailure(@NonNull Call call, @NonNull IOException e) {
                          runOnUiThread(() -> { swipeVod.setRefreshing(false); Toast.makeText(MainActivity.this, "连接超时，请切换线路", Toast.LENGTH_SHORT).show(); });
                      }
                      @Override public void onResponse(@NonNull Call call, @NonNull Response response) throws IOException {
                          if (response.isSuccessful() && response.body() != null) {
                              try {
                                  JSONObject json = new JSONObject(response.body().string());
                                  JSONArray list = json.optJSONArray("list");
                                  List<VodItem> parsed = new ArrayList<>();
                                  if (list != null) {
                                      for (int i = 0; i < list.length(); i++) {
                                          JSONObject it = list.getJSONObject(i);
                                          VodItem v = new VodItem();
                                          v.id = it.optString("vod_id");
                                          v.name = it.optString("vod_name");
                                          v.pic = it.optString("vod_pic");
                                          v.remarks = it.optString("vod_remarks");
                                          double sc = 7.0 + (Math.abs(v.name.hashCode()) % 26) / 10.0;
                                          v.score = "评分: " + String.format(Locale.getDefault(), "%.1f", sc);
                                          v.playFrom = it.optString("vod_play_from");
                                          v.playUrl = it.optString("vod_play_url");
                                          parseVodGroups(v);
                                          parsed.add(v);
                                      }
                                  }
                                  runOnUiThread(() -> {
                                      vodList.clear();
                                      vodList.addAll(parsed);
                                      vodAdapter.notifyDataSetChanged();
                                      swipeVod.setRefreshing(false);
                                  });
                              } catch (Exception e) { runOnUiThread(() -> swipeVod.setRefreshing(false)); }
                          }
                      }
                  });
              }

              private void parseVodGroups(VodItem v) {
                  v.playGroups.clear();
                  if (v.playUrl == null || v.playUrl.trim().isEmpty()) return;
                  String[] fromArr = (v.playFrom != null && !v.playFrom.isEmpty()) ? v.playFrom.split("\\$\\$\\$") : new String[0];
                  String[] urlGroupArr = v.playUrl.split("\\$\\$\\$");

                  for (int g = 0; g < urlGroupArr.length; g++) {
                      PlayGroup grp = new PlayGroup();
                      grp.fromName = (g < fromArr.length) ? fromArr[g].trim().toUpperCase() : ("线路 " + (g + 1));
                      String[] eps = urlGroupArr[g].split("#|\\r?\\n");
                      for (String epStr : eps) {
                          epStr = epStr.trim();
                          if (epStr.isEmpty()) continue;
                          if (epStr.contains("$")) {
                              String[] p = epStr.split("\\$");
                              if (p.length > 1 && p[1].trim().startsWith("http")) grp.episodes.add(new Episode(p[0].trim(), p[1].trim()));
                          } else if (epStr.startsWith("http")) {
                              grp.episodes.add(new Episode("第 " + (grp.episodes.size() + 1) + " 集", epStr));
                          }
                      }
                      if (!grp.episodes.isEmpty()) v.playGroups.add(grp);
                  }
              }

              private void showVodRouteDialog() {
                  String[] names = new String[vodRoutes.size()];
                  for (int i = 0; i < vodRoutes.size(); i++) names[i] = vodRoutes.get(i).name;
                  new AlertDialog.Builder(this).setTitle("切换 TVBox 线路仓")
                      .setSingleChoiceItems(names, currentVodRouteIndex, (d, w) -> {
                          currentVodRouteIndex = w;
                          loadVodData("", "");
                          d.dismiss();
                      }).show();
              }

              private void showEpisodeSheet(VodItem vod) {
                  BottomSheetDialog sheet = new BottomSheetDialog(this);
                  View view = LayoutInflater.from(this).inflate(R.layout.dialog_episodes, null);
                  ((TextView) view.findViewById(R.id.tv_episode_sheet_title)).setText(vod.name + " - 选集");

                  ChipGroup cg = view.findViewById(R.id.chip_group_sources);
                  RecyclerView rv = view.findViewById(R.id.recycler_episodes);
                  rv.setLayoutManager(new GridLayoutManager(this, 4));

                  final int[] activeG = {currentGroupIndex < vod.playGroups.size() ? currentGroupIndex : 0};
                  Runnable updateList = () -> {
                      PlayGroup group = vod.playGroups.get(activeG[0]);
                      rv.setAdapter(new RecyclerView.Adapter<EpisodeVH>() {
                          @NonNull @Override public EpisodeVH onCreateViewHolder(@NonNull ViewGroup p, int vt) {
                              return new EpisodeVH(LayoutInflater.from(p.getContext()).inflate(R.layout.item_episode_btn, p, false));
                          }
                          @Override public void onBindViewHolder(@NonNull EpisodeVH h, int pos) {
                              Episode ep = group.episodes.get(pos);
                              h.btn.setText(ep.title);
                              boolean isCur = (vod == currentPlayingVod && activeG[0] == currentGroupIndex && pos == currentEpisodeIndex);
                              h.btn.setBackgroundTintList(android.content.res.ColorStateList.valueOf(isCur ? 0xFF2979FF : 0xFF21262D));
                              h.btn.setOnClickListener(v -> {
                                  sheet.dismiss();
                                  playVodEpisode(vod, activeG[0], pos);
                              });
                          }
                          @Override public int getItemCount() { return group.episodes.size(); }
                      });
                  };

                  cg.removeAllViews();
                  for (int i = 0; i < vod.playGroups.size(); i++) {
                      Chip chip = new Chip(this);
                      chip.setText(vod.playGroups.get(i).fromName);
                      chip.setCheckable(true);
                      chip.setChecked(i == activeG[0]);
                      final int idx = i;
                      chip.setOnClickListener(v -> { activeG[0] = idx; updateList.run(); });
                      cg.addView(chip);
                  }
                  updateList.run();
                  sheet.setContentView(view);
                  sheet.show();
              }

