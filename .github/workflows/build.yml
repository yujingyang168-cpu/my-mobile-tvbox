                  findViewById(R.id.btn_ratio_zoom).setOnClickListener(v -> setRatio(AspectRatioFrameLayout.RESIZE_MODE_ZOOM, "裁剪"));

                  findViewById(R.id.btn_set_skip_intro).setOnClickListener(v -> showCustomSkipInputDialog(true));
                  findViewById(R.id.btn_set_skip_outro).setOnClickListener(v -> showCustomSkipInputDialog(false));
                  findViewById(R.id.btn_reset_skip).setOnClickListener(v -> {
                      skipIntroSeconds = 0; skipOutroSeconds = 0;
                      prefs.edit().putInt("skip_intro_sec", 0).putInt("skip_outro_sec", 0).apply();
                      ((TextView) findViewById(R.id.btn_set_skip_intro)).setText("片头 00:00");
                      ((TextView) findViewById(R.id.btn_set_skip_outro)).setText("片尾 00:00");
                      Toast.makeText(this, "片头片尾已重置", Toast.LENGTH_SHORT).show();
                  });

                  findViewById(R.id.btn_drawer_replay).setOnClickListener(v -> {
                      if (player != null) player.seekTo(0);
                      playerSettingsDrawer.setVisibility(View.GONE);
                  });
                  findViewById(R.id.btn_drawer_refresh).setOnClickListener(v -> {
                      if (currentPlayingVod != null) playVodEpisode(currentPlayingVod, currentGroupIndex, currentEpisodeIndex);
                      playerSettingsDrawer.setVisibility(View.GONE);
                  });
                  findViewById(R.id.btn_drawer_fav).setOnClickListener(v -> {
                      if (currentPlayingVod != null) toggleFavorite(currentPlayingVod);
                  });
                  findViewById(R.id.btn_drawer_cast).setOnClickListener(v -> {
                      playerSettingsDrawer.setVisibility(View.GONE);
                      showCastScreenDialog();
                  });

                  SwitchMaterial swHideMini = findViewById(R.id.switch_hide_mini_progress);
                  swHideMini.setOnCheckedChangeListener((bv, isChecked) -> {
                      alwaysMiniProgress.setVisibility(isChecked ? View.GONE : View.VISIBLE);
                  });

                  playerSeekBar.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override public void onProgressChanged(SeekBar seekBar, int progress, boolean fromUser) {
                          if (fromUser && !isLivePlaying && player.getDuration() > 0) {
                              long newPos = (player.getDuration() * progress) / 1000L;
                              tvCombinedTime.setText(formatTime(newPos) + " / " + formatTime(player.getDuration()));
                          }
                      }
                      @Override public void onStartTrackingTouch(SeekBar seekBar) {
                          isUserSeeking = true;
                          uiHandler.removeCallbacks(hideControlsRunnable);
                      }
                      @Override public void onStopTrackingTouch(SeekBar seekBar) {
                          isUserSeeking = false;
                          if (!isLivePlaying && player.getDuration() > 0) {
                              player.seekTo((player.getDuration() * seekBar.getProgress()) / 1000L);
                          }
                          resetHideControlsTimer();
                      }
                  });
              }

              private void setRatio(int mode, String name) {
                  playerView.setResizeMode(mode);
                  Toast.makeText(this, "画面比例已调整: " + name, Toast.LENGTH_SHORT).show();
              }

              private final Runnable hideControlsRunnable = () -> {
                  if (playerControlOverlay.getVisibility() == View.VISIBLE && !isScreenLocked) {
                      playerControlOverlay.setVisibility(View.GONE);
                      btnLockScreen.setVisibility(View.GONE);
                      rightPlayerActions.setVisibility(View.GONE);
                  }
              };

              private void resetHideControlsTimer() {
                  uiHandler.removeCallbacks(hideControlsRunnable);
                  if (playerControlOverlay.getVisibility() == View.VISIBLE && !isScreenLocked) {
                      uiHandler.postDelayed(hideControlsRunnable, 5000);
                  }
              }

              private void initPlayer() {
                  DefaultHttpDataSource.Factory httpFactory = new DefaultHttpDataSource.Factory()
                      .setUserAgent("Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36")
                      .setAllowCrossProtocolRedirects(true)
                      .setConnectTimeoutMs(15000)
                      .setReadTimeoutMs(15000);

                  DefaultDataSource.Factory dataSourceFactory = new DefaultDataSource.Factory(this, httpFactory);
                  DefaultMediaSourceFactory mediaSourceFactory = new DefaultMediaSourceFactory(this).setDataSourceFactory(dataSourceFactory);

                  player = new ExoPlayer.Builder(this).setMediaSourceFactory(mediaSourceFactory).build();
                  playerView.setPlayer(player);

                  player.addListener(new Player.Listener() {
                      @Override public void onPlaybackStateChanged(int state) {
                          bufferingProgress.setVisibility(state == Player.STATE_BUFFERING ? View.VISIBLE : View.GONE);
                          if (state == Player.STATE_READY) {
                              updatePlayPauseIcon();
                              updateProgress();
                              if (hasPendingSkipIntro && skipIntroSeconds > 0 && !isLivePlaying) {
                                  hasPendingSkipIntro = false;
                                  if (player.getDuration() > skipIntroSeconds * 1000L) {
                                      player.seekTo(skipIntroSeconds * 1000L);
                                  }
                              }
                          } else if (state == Player.STATE_ENDED) {
                              playNextEpisode();
                          }
                      }
                      @Override public void onIsPlayingChanged(boolean isPlaying) { updatePlayPauseIcon(); }
                      @Override public void onPlayerError(@NonNull PlaybackException error) {
                          bufferingProgress.setVisibility(View.GONE);
                          Toast.makeText(MainActivity.this, "播放失败(" + error.getErrorCodeName() + ")，请尝试换线", Toast.LENGTH_SHORT).show();
                      }
                  });
              }

              private void updatePlayPauseIcon() {
                  btnCenterPlay.setText(player.isPlaying() ? "⏸" : "▶");
              }

              private void playPrevEpisode() {
                  if (currentPlayingVod != null && currentEpisodeIndex > 0) {
                      playVodEpisode(currentPlayingVod, currentGroupIndex, currentEpisodeIndex - 1);
                  } else {
                      Toast.makeText(this, "已经是第一集了", Toast.LENGTH_SHORT).show();
                  }
              }

              private void playNextEpisode() {
                  if (currentPlayingVod != null) {
                      PlayGroup group = currentPlayingVod.playGroups.get(currentGroupIndex);
                      if (currentEpisodeIndex < group.episodes.size() - 1) {
                          playVodEpisode(currentPlayingVod, currentGroupIndex, currentEpisodeIndex + 1);
                      } else {
                          Toast.makeText(this, "已经播完最后一集", Toast.LENGTH_SHORT).show();
                      }
                  }
              }

              private void playVodEpisode(VodItem item, int groupIdx, int epIdx) {
                  currentPlayingVod = item;
                  currentGroupIndex = groupIdx;
                  currentEpisodeIndex = epIdx;
                  isLivePlaying = false;
                  hasPendingSkipIntro = true;

                  PlayGroup group = item.playGroups.get(groupIdx);
                  Episode ep = group.episodes.get(epIdx);

                  saveWatchHistory(item, ep.title);
                  playMedia(item.name + " " + ep.title, ep.url);
              }

              private void playMedia(String title, String url) {
                  currentMediaUrl = url.trim().replace("&amp;", "&");
                  tvPlayerTitle.setText(title);
                  player.stop();

                  MediaItem.Builder builder = new MediaItem.Builder().setUri(currentMediaUrl);
                  if (currentMediaUrl.contains(".m3u8") || currentMediaUrl.contains("m3u8")) {
                      builder.setMimeType(MimeTypes.APPLICATION_M3U8);
                  }
                  player.setMediaItem(builder.build());
                  player.prepare();
                  player.play();

                  resetHideControlsTimer();
              }

              private void startPeriodicUiUpdates() {
                  uiHandler.post(new Runnable() {
                      @Override public void run() {
                          String curTime = new SimpleDateFormat("HH:mm", Locale.getDefault()).format(new Date());
                          BatteryManager bm = (BatteryManager) getSystemService(BATTERY_SERVICE);
                          int battery = bm != null ? bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY) : 100;

                          tvPlayerTimeBattery.setText(curTime + "  🔋 " + battery + "%");

                          if (player != null && !isLivePlaying && player.isPlaying() && !isUserSeeking) {
                              updateProgress();
                              long dur = player.getDuration();
                              long pos = player.getCurrentPosition();
                              if (skipOutroSeconds > 0 && dur > 40000L && pos >= (dur - skipOutroSeconds * 1000L)) {
                                  playNextEpisode();
                              }
                          }
                          uiHandler.postDelayed(this, 1000);
                      }
                  });
              }

              private void updateProgress() {
                  long duration = player.getDuration();
                  long position = player.getCurrentPosition();
                  if (duration > 0) {
                      int progress = (int) ((position * 1000L) / duration);
                      playerSeekBar.setProgress(progress);
                      alwaysMiniProgress.setProgress(progress);
                      tvCombinedTime.setText(formatTime(position) + " / " + formatTime(duration));
                  }
              }

              private String formatTime(long ms) {
                  long totalSec = Math.max(0, ms / 1000);
                  long sec = totalSec % 60;
                  long min = (totalSec / 60) % 60;
                  long hour = totalSec / 3600;
                  if (hour > 0) return String.format(Locale.getDefault(), "%02d:%02d:%02d", hour, min, sec);
                  return String.format(Locale.getDefault(), "%02d:%02d", min, sec);
              }

              private void toggleFullscreen() {
                  int orientation = getResources().getConfiguration().orientation;
                  if (orientation == Configuration.ORIENTATION_PORTRAIT) {
                      setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE);
                  } else {
                      setRequestedOrientation(ActivityInfo.SCREEN_ORIENTATION_PORTRAIT);
                  }
              }

              @Override
              public void onConfigurationChanged(@NonNull Configuration newConfig) {
                  super.onConfigurationChanged(newConfig);
                  if (newConfig.orientation == Configuration.ORIENTATION_LANDSCAPE) {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      );
                      playerContainer.setLayoutParams(new RelativeLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT
                      ));
                      findViewById(R.id.content_container).setVisibility(View.GONE);
                      bottomNav.setVisibility(View.GONE);
                  } else {
                      getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
                      playerContainer.setLayoutParams(new RelativeLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, (int) (220 * getResources().getDisplayMetrics().density)
                      ));
                      playerSettingsDrawer.setVisibility(View.GONE);
                      findViewById(R.id.content_container).setVisibility(View.VISIBLE);
                      bottomNav.setVisibility(View.VISIBLE);
                  }
              }

              private void saveWatchHistory(VodItem item, String epTitle) {
                  try {
                      String historyStr = prefs.getString("watch_history", "[]");
                      JSONArray arr = new JSONArray(historyStr);
                      JSONArray newArr = new JSONArray();

                      JSONObject obj = new JSONObject();
                      obj.put("id", item.id);
                      obj.put("name", item.name);
                      obj.put("pic", item.pic);
                      obj.put("epTitle", epTitle);
                      obj.put("time", System.currentTimeMillis());
                      newArr.put(obj);

                      for (int i = 0; i < arr.length() && newArr.length() < 30; i++) {
                          JSONObject old = arr.getJSONObject(i);
                          if (!old.optString("id").equals(item.id)) newArr.put(old);
                      }
                      prefs.edit().putString("watch_history", newArr.toString()).apply();
                  } catch (Exception ignored) {}
              }

              private void toggleFavorite(VodItem item) {
                  try {
                      String favStr = prefs.getString("user_favorites", "[]");
                      JSONArray arr = new JSONArray(favStr);
                      boolean found = false;
                      JSONArray newArr = new JSONArray();

                      for (int i = 0; i < arr.length(); i++) {
                          JSONObject obj = arr.getJSONObject(i);
                          if (obj.optString("id").equals(item.id)) found = true;
                          else newArr.put(obj);
                      }

                      if (!found) {
                          JSONObject obj = new JSONObject();
                          obj.put("id", item.id);
                          obj.put("name", item.name);
                          obj.put("pic", item.pic);
                          obj.put("remarks", item.remarks);
                          newArr.put(obj);
                          Toast.makeText(this, "已加入收藏夹 ★", Toast.LENGTH_SHORT).show();
                      } else {
                          Toast.makeText(this, "已从收藏夹移除", Toast.LENGTH_SHORT).show();
                      }
                      prefs.edit().putString("user_favorites", newArr.toString()).apply();
                  } catch (Exception ignored) {}
              }

