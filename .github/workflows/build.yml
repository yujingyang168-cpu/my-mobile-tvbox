              private void showLiveSourceDialog() {
                  String[] items = new String[]{"国内 IPv4 优质源 (全网秒开)", "全国 IPv6 高清专线 (需网络支持)", "恢复默认源"};
                  new AlertDialog.Builder(this).setTitle("更新电视直播源")
                      .setItems(items, (d, w) -> {
                          if (w == 0) fetchLiveM3u(URL_IPV4_LIVE);
                          else if (w == 1) fetchLiveM3u(URL_IPV6_LIVE);
                          else loadDefaultOrCachedLive();
                      }).show();
              }

              private void fetchLiveM3u(String url) {
                  Toast.makeText(this, "正在更新直播线路...", Toast.LENGTH_SHORT).show();
                  httpClient.newCall(new Request.Builder().url(url).build()).enqueue(new Callback() {
                      @Override public void onFailure(@NonNull Call call, @NonNull IOException e) {}
                      @Override public void onResponse(@NonNull Call call, @NonNull Response response) throws IOException {
                          if (response.isSuccessful() && response.body() != null) {
                              String content = response.body().string();
                              runOnUiThread(() -> {
                                  parseLiveM3u(content);
                                  Toast.makeText(MainActivity.this, "直播源已更新，共 " + allLiveChannels.size() + " 个频道", Toast.LENGTH_SHORT).show();
                              });
                          }
                      }
                  });
              }

              private void parseLiveM3u(String content) {
                  allLiveChannels.clear();
                  String[] lines = content.split("\\r?\\n");
                  String curName = "";
                  String curGroup = "其他";
                  for (String line : lines) {
                      line = line.trim();
                      if (line.startsWith("#EXTINF:")) {
                          int comma = line.lastIndexOf(",");
                          if (comma != -1) curName = line.substring(comma + 1).trim();
                          if (line.contains("group-title=\"")) {
                              int s = line.indexOf("group-title=\"") + 13;
                              int e = line.indexOf("\"", s);
                              if (e != -1) curGroup = line.substring(s, e);
                          }
                      } else if (line.startsWith("http://") || line.startsWith("https://")) {
                          if (!curName.isEmpty()) {
                              allLiveChannels.add(new LiveChannel(curName, curGroup, line));
                              curName = "";
                          }
                      }
                  }
                  displayLiveChannels.clear();
                  displayLiveChannels.addAll(allLiveChannels);
                  liveAdapter.notifyDataSetChanged();
              }

              private void filterLiveCategory(String cat) {
                  displayLiveChannels.clear();
                  if ("全部".equals(cat)) displayLiveChannels.addAll(allLiveChannels);
                  else {
                      for (LiveChannel c : allLiveChannels) if (c.group.contains(cat) || c.name.contains(cat)) displayLiveChannels.add(c);
                  }
                  liveAdapter.notifyDataSetChanged();
              }

