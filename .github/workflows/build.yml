              private void updateSuggestionList(String query) {
                  currentSuggestions.clear();
                  if (query.isEmpty()) {
                      for (int i = 0; i < 8; i++) currentSuggestions.add(hotSearchSeed[i]);
                      suggestionAdapter.notifyDataSetChanged();
                  } else {
                      for (String word : hotSearchSeed) {
                          if (word.contains(query)) currentSuggestions.add(word);
                      }
                      if (currentSuggestions.isEmpty()) {
                          currentSuggestions.add("全网搜索: " + query);
                      }
                      suggestionAdapter.notifyDataSetChanged();
                      fetchBaiduOnlineSuggestions(query);
                  }
              }

              private void fetchBaiduOnlineSuggestions(String keyword) {
                  try {
                      String url = "https://suggestion.baidu.com/su?wd=" + URLEncoder.encode(keyword, "UTF-8") + "&action=opensearch";
                      Request req = new Request.Builder().url(url).build();
                      httpClient.newCall(req).enqueue(new Callback() {
                          @Override
                          public void onFailure(@NonNull Call call, @NonNull IOException e) {}

                          @Override
                          public void onResponse(@NonNull Call call, @NonNull Response response) throws IOException {
                              if (response.isSuccessful() && response.body() != null) {
                                  try {
                                      String str = response.body().string();
                                      JSONArray arr = new JSONArray(str);
                                      if (arr.length() >= 2) {
                                          JSONArray items = arr.getJSONArray(1);
                                          List<String> netSuggestions = new ArrayList<>();
                                          for (int i = 0; i < Math.min(items.length(), 6); i++) {
                                              netSuggestions.add(items.getString(i));
                                          }
                                          runOnUiThread(() -> {
                                              currentSuggestions.clear();
                                              currentSuggestions.addAll(netSuggestions);
                                              if (currentSuggestions.isEmpty()) currentSuggestions.add(keyword);
                                              suggestionAdapter.notifyDataSetChanged();
                                          });
                                      }
                                  } catch (Exception ignored) {}
                              }
                          }
                      });
                  } catch (Exception ignored) {}
              }

              private void executeSearch(String keyword) {
                  etSearch.setText(keyword);
                  etSearch.setSelection(keyword.length());
                  layoutSearchSuggestions.setVisibility(View.GONE);

                  View view = getCurrentFocus();
                  if (view != null) {
                      InputMethodManager imm = (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                      if (imm != null) imm.hideSoftInputFromWindow(view.getWindowToken(), 0);
                  }
                  loadVodData(keyword, "");
              }

              // 补齐缓存大小统计与展示实现
              private void updateCacheDisplay() {
                  new Thread(() -> {
                      long size = getDirSize(getCacheDir()) + getDirSize(getExternalCacheDir());
                      String formatted = formatFileSize(size);
                      runOnUiThread(() -> {
                          if (tvCacheSize != null) {
                              tvCacheSize.setText("当前缓存占用: " + formatted);
                          }
                      });
                  }).start();
              }

              // 补齐一键清理本地缓存实现
              private void clearAppCache() {
                  ProgressDialog pd = new ProgressDialog(this);
                  pd.setMessage("正在深度清理本地媒体与海报缓存...");
                  pd.show();

                  new Thread(() -> {
                      deleteDir(getCacheDir());
                      deleteDir(getExternalCacheDir());
                      runOnUiThread(() -> Glide.get(MainActivity.this).clearMemory());
                      Glide.get(MainActivity.this).clearDiskCache();

                      runOnUiThread(() -> {
                          pd.dismiss();
                          updateCacheDisplay();
                          Toast.makeText(MainActivity.this, "缓存清理成功！", Toast.LENGTH_SHORT).show();
                      });
                  }).start();
              }

              private long getDirSize(File dir) {
                  long size = 0;
                  if (dir != null && dir.isDirectory()) {
                      File[] files = dir.listFiles();
                      if (files != null) {
                          for (File f : files) {
                              if (f.isDirectory()) size += getDirSize(f);
                              else size += f.length();
                          }
                      }
                  } else if (dir != null && dir.isFile()) {
                      size += dir.length();
                  }
                  return size;
              }

              private boolean deleteDir(File dir) {
                  if (dir != null && dir.isDirectory()) {
                      String[] children = dir.list();
                      if (children != null) {
                          for (String child : children) {
                              boolean success = deleteDir(new File(dir, child));
                              if (!success) return false;
                          }
                      }
                      return dir.delete();
                  } else if (dir != null && dir.isFile()) {
                      return dir.delete();
                  }
                  return false;
              }

              private String formatFileSize(long bytes) {
                  if (bytes <= 0) return "0.00 MB";
                  double mb = bytes / (1024.0 * 1024.0);
                  if (mb < 0.1) return String.format(Locale.getDefault(), "%.2f KB", bytes / 1024.0);
                  return String.format(Locale.getDefault(), "%.2f MB", mb);
              }

