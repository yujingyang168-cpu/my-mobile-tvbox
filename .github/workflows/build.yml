              private void cycleAspectRatio() {
                  resizeModeIndex = (resizeModeIndex + 1) % 3;
                  if (resizeModeIndex == 0) {
                      playerView.setResizeMode(AspectRatioFrameLayout.RESIZE_MODE_FIT);
                      Toast.makeText(this, "画面比例: 自适应", Toast.LENGTH_SHORT).show();
                  } else if (resizeModeIndex == 1) {
                      playerView.setResizeMode(AspectRatioFrameLayout.RESIZE_MODE_FILL);
                      Toast.makeText(this, "画面比例: 拉伸铺满", Toast.LENGTH_SHORT).show();
                  } else {
                      playerView.setResizeMode(AspectRatioFrameLayout.RESIZE_MODE_ZOOM);
                      Toast.makeText(this, "画面比例: 居中裁剪", Toast.LENGTH_SHORT).show();
                  }
              }

