              private void playMedia(String title, String url) {
                  if (url == null || url.trim().isEmpty()) {
                      Toast.makeText(this, "无效的播放地址", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  url = url.trim().replace("&amp;", "&");
                  tvPlayerTitle.setText(title);
                  player.stop();

                  MediaItem.Builder builder = new MediaItem.Builder().setUri(url);
                  if (url.toLowerCase().contains(".m3u8") || url.toLowerCase().contains("m3u8")) {
                      builder.setMimeType(MimeTypes.APPLICATION_M3U8);
                  } else if (url.toLowerCase().contains(".mp4")) {
                      builder.setMimeType(MimeTypes.APPLICATION_MP4);
                  }

                  player.setMediaItem(builder.build());
                  player.prepare();
                  player.play();

                  resetHideControlsTimer();
              }

              // 定时更新：组合时长显示、片尾监测与系统时钟
              private void startPeriodicUiUpdates() {
                  uiHandler.post(new Runnable() {
                      @Override
                      public void run() {
                          // 1. 系统当前时间更新
                          String curTime = new SimpleDateFormat("HH:mm", Locale.getDefault()).format(new Date());
                          tvSystemTime.setText(curTime);

                          // 2. 点播进度与自动跳过片尾
                          if (player != null && !isLivePlaying && player.isPlaying() && !isUserSeeking) {
                              updateProgress();

                              long duration = player.getDuration();
                              long position = player.getCurrentPosition();
                              if (skipOutroSeconds > 0 && duration > 40000L && position >= (duration - skipOutroSeconds * 1000L)) {
                                  if (currentPlayingVod != null) {
                                      PlayGroup group = currentPlayingVod.playGroups.get(currentGroupIndex);
                                      if (currentEpisodeIndex < group.episodes.size() - 1) {
                                          Toast.makeText(MainActivity.this, "已进入片尾，自动播放下一集", Toast.LENGTH_SHORT).show();
                                          playNextEpisode();
                                      }
                                  }
                              }
                          }
                          uiHandler.postDelayed(this, 1000);
                      }
                  });
              }

              private void updateProgress() {
                  long duration = player.getDuration();
                  long position = player.getCurrentPosition();

                  if (duration > 0) {
                      int progress = (int) ((position * 1000L) / duration);
                      playerSeekBar.setProgress(progress);
                      tvCombinedTime.setText(formatTime(position) + " / " + formatTime(duration));
                  }
              }

              private String formatTime(long ms) {
                  long totalSeconds = Math.max(0, ms / 1000);
                  long seconds = totalSeconds % 60;
                  long minutes = (totalSeconds / 60) % 60;
                  long hours = totalSeconds / 3600;

                  if (hours > 0) {
                      return String.format(Locale.getDefault(), "%02d:%02d:%02d", hours, minutes, seconds);
                  } else {
                      return String.format(Locale.getDefault(), "%02d:%02d", minutes, seconds);
                  }
              }

              // ================= 点播列表与数据解析 =================
              private void loadVodData(String keyword) {
                  swipeVod.setRefreshing(true);
                  VodRoute route = vodRoutes.get(currentVodRouteIndex);
                  String url = route.api + "?ac=videolist" + (keyword.isEmpty() ? "&pg=1" : "&wd=" + keyword);

                  Request request = new Request.Builder().url(url).build();
                  httpClient.newCall(request).enqueue(new Callback() {
                      @Override
                      public void onFailure(@NonNull Call call, @NonNull IOException e) {
                          runOnUiThread(() -> {
                              swipeVod.setRefreshing(false);
                              Toast.makeText(MainActivity.this, "点播线路连接超时，请切换线路", Toast.LENGTH_SHORT).show();
                          });
                      }

                      @Override
                      public void onResponse(@NonNull Call call, @NonNull Response response) throws IOException {
                          if (response.isSuccessful() && response.body() != null) {
                              try {
                                  String bodyStr = response.body().string();
                                  JSONObject json = new JSONObject(bodyStr);
                                  JSONArray list = json.optJSONArray("list");
                                  List<VodItem> parsed = new ArrayList<>();
                                  if (list != null) {
                                      for (int i = 0; i < list.length(); i++) {
                                          JSONObject item = list.getJSONObject(i);
                                          VodItem v = new VodItem();
                                          v.id = item.optString("vod_id");
                                          v.name = item.optString("vod_name");
                                          v.pic = item.optString("vod_pic");
                                          v.remarks = item.optString("vod_remarks");
                                          v.playFrom = item.optString("vod_play_from");
                                          v.playUrl = item.optString("vod_play_url");
                                          parseVodGroups(v);
                                          parsed.add(v);
                                      }
                                  }
                                  runOnUiThread(() -> {
                                      vodList.clear();
                                      vodList.addAll(parsed);
                                      vodAdapter.notifyDataSetChanged();
                                      swipeVod.setRefreshing(false);
                                  });
                              } catch (Exception e) {
                                  runOnUiThread(() -> swipeVod.setRefreshing(false));
                              }
                          }
                      }
                  });
              }

              private void parseVodGroups(VodItem v) {
                  v.playGroups.clear();
                  if (v.playUrl == null || v.playUrl.trim().isEmpty()) return;

                  String[] fromArr = (v.playFrom != null && !v.playFrom.isEmpty()) ? v.playFrom.split("\\$\\$\\$") : new String[0];
                  String[] urlGroupArr = v.playUrl.split("\\$\\$\\$");

                  for (int g = 0; g < urlGroupArr.length; g++) {
                      PlayGroup group = new PlayGroup();
                      String rawFrom = (g < fromArr.length) ? fromArr[g].trim() : ("线路 " + (g + 1));
                      group.fromName = rawFrom.toUpperCase();

                      String[] eps = urlGroupArr[g].split("#|\\r?\\n");
                      for (String epStr : eps) {
                          epStr = epStr.trim();
                          if (epStr.isEmpty()) continue;

                          if (epStr.contains("$")) {
                              String[] parts = epStr.split("\\$");
                              String title = parts[0].trim();
                              String link = "";
                              for (int p = 1; p < parts.length; p++) {
                                  if (parts[p].trim().startsWith("http")) {
                                      link = parts[p].trim();
                                      break;
                                  }
                              }
                              if (link.isEmpty() && parts.length > 1) link = parts[1].trim();
                              if (link.startsWith("http")) group.episodes.add(new Episode(title, link));
                          } else if (epStr.startsWith("http")) {
                              group.episodes.add(new Episode("第 " + (group.episodes.size() + 1) + " 集", epStr));
                          }
                      }

                      if (!group.episodes.isEmpty()) v.playGroups.add(group);
                  }

                  v.playGroups.sort((g1, g2) -> {
                      boolean g1IsM3u = g1.fromName.contains("M3U") || (!g1.episodes.isEmpty() && g1.episodes.get(0).url.contains(".m3u8"));
                      boolean g2IsM3u = g2.fromName.contains("M3U") || (!g2.episodes.isEmpty() && g2.episodes.get(0).url.contains(".m3u8"));
                      if (g1IsM3u && !g2IsM3u) return -1;
                      if (!g1IsM3u && g2IsM3u) return 1;
                      return 0;
                  });
              }

