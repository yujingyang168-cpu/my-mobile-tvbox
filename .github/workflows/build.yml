              private void fetchLiveM3u(String url) {
                  Toast.makeText(this, "正在更新直播线路...", Toast.LENGTH_SHORT).show();
                  Request req = new Request.Builder().url(url).build();
                  httpClient.newCall(req).enqueue(new Callback() {
                      @Override
                      public void onFailure(@NonNull Call call, @NonNull IOException e) {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "直播源拉取超时", Toast.LENGTH_SHORT).show());
                      }

                      @Override
                      public void onResponse(@NonNull Call call, @NonNull Response response) throws IOException {
                          if (response.isSuccessful() && response.body() != null) {
                              String m3u = response.body().string();
                              runOnUiThread(() -> {
                                  prefs.edit().putString("cached_live_m3u", m3u).apply();
                                  parseLiveM3u(m3u);
                                  Toast.makeText(MainActivity.this, "直播源更新成功，共 " + allLiveChannels.size() + " 个频道", Toast.LENGTH_SHORT).show();
                              });
                          }
                      }
                  });
              }

              private void parseLiveM3u(String content) {
                  allLiveChannels.clear();
                  String[] lines = content.split("\\r?\\n");
                  String curName = "";
                  String curGroup = "其他";

                  for (String line : lines) {
                      line = line.trim();
                      if (line.startsWith("#EXTINF:")) {
                          int comma = line.lastIndexOf(",");
                          if (comma != -1) curName = line.substring(comma + 1).trim();
                          if (line.contains("group-title=\"")) {
                              int start = line.indexOf("group-title=\"") + 13;
                              int end = line.indexOf("\"", start);
                              if (end != -1) curGroup = line.substring(start, end);
                          }
                      } else if (line.startsWith("http://") || line.startsWith("https://")) {
                          if (!curName.isEmpty()) {
                              allLiveChannels.add(new LiveChannel(curName, curGroup, line));
                              curName = "";
                          }
                      }
                  }

                  displayLiveChannels.clear();
                  displayLiveChannels.addAll(allLiveChannels);
                  liveAdapter.notifyDataSetChanged();
              }

              private void filterLiveCategory(String cat) {
                  displayLiveChannels.clear();
                  if ("全部".equals(cat)) {
                      displayLiveChannels.addAll(allLiveChannels);
                  } else {
                      for (LiveChannel c : allLiveChannels) {
                          if (c.group.contains(cat) || c.name.contains(cat)) displayLiveChannels.add(c);
                      }
                  }
                  currentPlayingLiveIndex = -1;
                  liveAdapter.notifyDataSetChanged();
              }

