              // 任意集数抽屉选集界面（在播/未播通用）
              private void showEpisodeSheet(VodItem vod) {
                  if (vod.playGroups.isEmpty()) {
                      Toast.makeText(this, "该影片暂无可用播放资源", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  BottomSheetDialog sheet = new BottomSheetDialog(this);
                  View view = LayoutInflater.from(this).inflate(R.layout.dialog_episodes, null);
                  TextView title = view.findViewById(R.id.tv_episode_sheet_title);
                  title.setText(vod.name + " - 选集播放");

                  ChipGroup chipGroup = view.findViewById(R.id.chip_group_sources);
                  RecyclerView recycler = view.findViewById(R.id.recycler_episodes);
                  recycler.setLayoutManager(new GridLayoutManager(this, 4));

                  final int[] activeGroupIndex = {currentGroupIndex < vod.playGroups.size() ? currentGroupIndex : 0};

                  Runnable updateEpisodeList = () -> {
                      PlayGroup group = vod.playGroups.get(activeGroupIndex[0]);
                      recycler.setAdapter(new RecyclerView.Adapter<EpisodeVH>() {
                          @NonNull
                          @Override
                          public EpisodeVH onCreateViewHolder(@NonNull ViewGroup parent, int viewType) {
                              View v = LayoutInflater.from(parent.getContext()).inflate(R.layout.item_episode_btn, parent, false);
                              return new EpisodeVH(v);
                          }

                          @Override
                          public void onBindViewHolder(@NonNull EpisodeVH holder, int position) {
                              Episode ep = group.episodes.get(position);
                              holder.btn.setText(ep.title);

                              // 当前正在播放的集数高亮显示
                              boolean isCurrent = (vod == currentPlayingVod && activeGroupIndex[0] == currentGroupIndex && position == currentEpisodeIndex);
                              holder.btn.setBackgroundTintList(android.content.res.ColorStateList.valueOf(
                                  isCurrent ? 0xFF6366F1 : 0xFF21262D
                              ));

                              holder.btn.setOnClickListener(v -> {
                                  sheet.dismiss();
                                  playVodEpisode(vod, activeGroupIndex[0], position);
                              });
                          }

                          @Override
                          public int getItemCount() {
                              return group.episodes.size();
                          }
                      });
                  };

                  chipGroup.removeAllViews();
                  for (int i = 0; i < vod.playGroups.size(); i++) {
                      Chip chip = new Chip(this);
                      chip.setText(vod.playGroups.get(i).fromName);
                      chip.setCheckable(true);
                      chip.setChecked(i == activeGroupIndex[0]);
                      final int idx = i;
                      chip.setOnClickListener(v -> {
                          activeGroupIndex[0] = idx;
                          updateEpisodeList.run();
                      });
                      chipGroup.addView(chip);
                  }

                  updateEpisodeList.run();
                  sheet.setContentView(view);
                  sheet.show();
              }

