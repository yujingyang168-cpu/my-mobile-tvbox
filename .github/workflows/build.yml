                          holder.tvName.setTextColor(0xFF6366F1);
                      } else {
                          holder.tvIndicator.setVisibility(View.GONE);
                          holder.tvName.setTextColor(0xFFFFFFFF);
                      }

                      holder.itemView.setOnClickListener(v -> {
                          currentPlayingLiveIndex = position;
                          notifyDataSetChanged();
                          playLiveStream(ch.name, ch.url);
                      });
