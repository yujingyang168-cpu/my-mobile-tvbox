      # 步骤 3：编译打包 Debug APK
      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      # 步骤 4：自动发布 Release
      - name: Automatically Create Release & Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          TAG_NAME="v2.${RUN_NUM}"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          
          gh release create "$TAG_NAME" "$APK_PATH" \
            --title "影视盒子 V2.${RUN_NUM}" \
            --notes "界面与功能全面升级：播放器全屏布局重构、播放设置二级抽屉、3列海报流首页、个人中心历史/收藏卡片以及屏幕旋转控制。"

      # 步骤 5：自动更新 version.json 与 release.keystore 并提交回仓库
      - name: Auto-update version.json & keystore in Repository
        env:
          RUN_NUM: ${{ github.run_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          DOWNLOAD_URL="https://gh-proxy.org/https://github.com/${{ github.repository }}/releases/download/v2.${RUN_NUM}/app-debug.apk"
          V_CODE=$((1000 + RUN_NUM))

          cat << EOF > version.json
          {
            "versionCode": $V_CODE,
            "versionName": "2.${RUN_NUM}",
            "apkUrl": "$DOWNLOAD_URL",
            "changelog": "1. 播放界面重构（分辨率角标/锁屏/旋转/控制栏）\n2. 新增播放设置二级菜单抽屉（比例/片头片尾/内核/收藏/投屏）\n3. 首页设计重构（4行筛选矩阵+3列带评分海报流）\n4. 个人中心重构（浅蓝天空顶栏+收藏/历史/投屏卡片）\n5. 新增观看历史、收藏与屏幕旋转控制"
          }
          EOF

          git add version.json app/release.keystore
          git commit -m "Auto update version.json & release.keystore to v2.${RUN_NUM} [skip ci]" || true
          git push origin HEAD || true
