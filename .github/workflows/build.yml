              private void showLiveSourceDialog() {
                  String[] items = new String[]{
                      "1. 国内 IPv4 优质公网源 (秒开推荐)",
                      "2. 全国 IPv6 高清专线源 (需网络支持)",
                      "3. 恢复内置通用直播源"
                  };
                  AlertDialog.Builder builder = new AlertDialog.Builder(this);
                  builder.setTitle("更新电视直播源");
                  builder.setItems(items, (dialog, which) -> {
                      if (which == 0) fetchLiveM3u(URL_IPV4_LIVE);
                      else if (which == 1) fetchLiveM3u(URL_IPV6_LIVE);
                      else {
                          prefs.edit().remove("cached_live_m3u").apply();
                          loadDefaultOrCachedLive();
                          Toast.makeText(this, "已恢复内置直播源", Toast.LENGTH_SHORT).show();
                      }
                  });
                  builder.show();
              }

              private void fetchLiveM3u(String url) {
                  Toast.makeText(this, "正在更新直播线路...", Toast.LENGTH_SHORT).show();
                  Request req = new Request.Builder().url(url).build();
                  httpClient.newCall(req).enqueue(new Callback() {
                      @Override
                      public void onFailure(@NonNull Call call, @NonNull IOException e) {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "直播源拉取超时", Toast.LENGTH_SHORT).show());
                      }

                      @Override
                      public void onResponse(@NonNull Call call, @NonNull Response response) throws IOException {
                          if (response.isSuccessful() && response.body() != null) {
                              String m3u = response.body().string();
                              runOnUiThread(() -> {
                                  prefs.edit().putString("cached_live_m3u", m3u).apply();
                                  parseLiveM3u(m3u);
                                  Toast.makeText(MainActivity.this, "直播源更新成功，共 " + allLiveChannels.size() + " 个频道", Toast.LENGTH_SHORT).show();
                              });
                          }
                      }
                  });
              }

              private void parseLiveM3u(String content) {
                  allLiveChannels.clear();
                  String[] lines = content.split("\\r?\\n");
                  String curName = "";
                  String curGroup = "其他";

                  for (String line : lines) {
                      line = line.trim();
                      if (line.startsWith("#EXTINF:")) {
                          int comma = line.lastIndexOf(",");
                          if (comma != -1) curName = line.substring(comma + 1).trim();
                          if (line.contains("group-title=\"")) {
                              int start = line.indexOf("group-title=\"") + 13;
                              int end = line.indexOf("\"", start);
                              if (end != -1) curGroup = line.substring(start, end);
                          }
                      } else if (line.startsWith("http://") || line.startsWith("https://")) {
                          if (!curName.isEmpty()) {
                              allLiveChannels.add(new LiveChannel(curName, curGroup, line));
                              curName = "";
                          }
                      }
                  }

                  displayLiveChannels.clear();
                  displayLiveChannels.addAll(allLiveChannels);
                  liveAdapter.notifyDataSetChanged();
              }

              private void filterLiveCategory(String cat) {
                  displayLiveChannels.clear();
                  if ("全部".equals(cat)) {
                      displayLiveChannels.addAll(allLiveChannels);
                  } else {
                      for (LiveChannel c : allLiveChannels) {
                          if (c.group.contains(cat) || c.name.contains(cat)) displayLiveChannels.add(c);
                      }
                  }
                  currentPlayingLiveIndex = -1;
                  liveAdapter.notifyDataSetChanged();
              }

              private void toggleFullscreen() {
                  int orientation = getResources().getConfiguration().orientation;
                  setRequestedOrientation(orientation == Configuration.ORIENTATION_PORTRAIT ?
                      ActivityInfo.SCREEN_ORIENTATION_LANDSCAPE : ActivityInfo.SCREEN_ORIENTATION_PORTRAIT);
              }

              @Override
              public void onConfigurationChanged(@NonNull Configuration newConfig) {
                  super.onConfigurationChanged(newConfig);
                  if (newConfig.orientation == Configuration.ORIENTATION_LANDSCAPE) {
                      getWindow().getDecorView().setSystemUiVisibility(
                          View.SYSTEM_UI_FLAG_FULLSCREEN | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                      );
                      playerContainer.setLayoutParams(new RelativeLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT
                      ));
                      findViewById(R.id.content_container).setVisibility(View.GONE);
                      bottomNav.setVisibility(View.GONE);
                      btnFullscreen.setText("退出");
                  } else {
                      getWindow().getDecorView().setSystemUiVisibility(View.SYSTEM_UI_FLAG_VISIBLE);
                      playerContainer.setLayoutParams(new RelativeLayout.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, (int) (220 * getResources().getDisplayMetrics().density)
                      ));
                      rightEpisodesDrawer.setVisibility(View.GONE);
                      findViewById(R.id.content_container).setVisibility(View.VISIBLE);
                      bottomNav.setVisibility(View.VISIBLE);
                      btnFullscreen.setText("全屏");
                  }
              }

