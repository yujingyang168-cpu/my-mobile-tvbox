              private void updateEpisodeNavButtonsState() {
                  if (currentPlayingVod == null || currentPlayingVod.playGroups.isEmpty() || isLivePlaying) {
                      btnPrevEp.setAlpha(0.3f);
                      btnNextEp.setAlpha(0.3f);
                      btnPrevEp.setEnabled(false);
                      btnNextEp.setEnabled(false);
                      return;
                  }

                  PlayGroup group = currentPlayingVod.playGroups.get(currentGroupIndex);
                  btnPrevEp.setEnabled(currentEpisodeIndex > 0);
                  btnPrevEp.setAlpha(currentEpisodeIndex > 0 ? 1.0f : 0.3f);

                  btnNextEp.setEnabled(currentEpisodeIndex < group.episodes.size() - 1);
                  btnNextEp.setAlpha(currentEpisodeIndex < group.episodes.size() - 1 ? 1.0f : 0.3f);
              }

              private void playPrevEpisode() {
                  if (currentPlayingVod != null && currentEpisodeIndex > 0) {
                      playVodEpisode(currentPlayingVod, currentGroupIndex, currentEpisodeIndex - 1);
                  } else {
                      Toast.makeText(this, "已经是第一集了", Toast.LENGTH_SHORT).show();
                  }
              }

              private void playNextEpisode() {
                  if (currentPlayingVod != null) {
                      PlayGroup group = currentPlayingVod.playGroups.get(currentGroupIndex);
                      if (currentEpisodeIndex < group.episodes.size() - 1) {
                          playVodEpisode(currentPlayingVod, currentGroupIndex, currentEpisodeIndex + 1);
                      } else {
                          Toast.makeText(this, "已经播完最后一集", Toast.LENGTH_SHORT).show();
                      }
                  }
              }

              private void playVodEpisode(VodItem item, int groupIdx, int epIdx) {
                  currentPlayingVod = item;
                  currentGroupIndex = groupIdx;
                  currentEpisodeIndex = epIdx;
                  isLivePlaying = false;
                  hasPendingSkipIntro = true; // 触发片头跳过

                  PlayGroup group = item.playGroups.get(groupIdx);
                  Episode ep = group.episodes.get(epIdx);

                  // 恢复点播控件显隐
                  btnPrevEp.setVisibility(View.VISIBLE);
                  btnNextEp.setVisibility(View.VISIBLE);
                  btnRewind10.setVisibility(View.VISIBLE);
                  btnForward10.setVisibility(View.VISIBLE);
                  playerSeekBar.setVisibility(View.VISIBLE);
                  btnEpisodesSheet.setVisibility(View.VISIBLE);
                  btnSpeedSwitch.setVisibility(View.VISIBLE);

                  updateEpisodeNavButtonsState();
                  playMedia(item.name + " · " + ep.title, ep.url);
              }

              private void playLiveStream(String name, String url) {
                  isLivePlaying = true;
                  currentPlayingVod = null;

                  // 直播控件处理
                  btnPrevEp.setVisibility(View.GONE);
                  btnNextEp.setVisibility(View.GONE);
                  btnRewind10.setVisibility(View.GONE);
                  btnForward10.setVisibility(View.GONE);
                  playerSeekBar.setVisibility(View.INVISIBLE);
                  btnEpisodesSheet.setVisibility(View.GONE);
                  btnSpeedSwitch.setVisibility(View.GONE);
                  tvCombinedTime.setText("🔴 实时直播");

                  playMedia(name, url);
