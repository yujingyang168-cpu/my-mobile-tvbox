                  @Override
                  public int getItemCount() {
                      return vodList.size();
                  }
              }

              static class VodVH extends RecyclerView.ViewHolder {
                  ImageView ivPoster;
                  TextView tvRemarks, tvTitle;
                  public VodVH(@NonNull View itemView) {
                      super(itemView);
                      ivPoster = itemView.findViewById(R.id.iv_vod_poster);
                      tvRemarks = itemView.findViewById(R.id.tv_vod_remarks);
                      tvTitle = itemView.findViewById(R.id.tv_vod_title);
                  }
              }

              static class EpisodeVH extends RecyclerView.ViewHolder {
                  Button btn;
                  public EpisodeVH(@NonNull View itemView) {
                      super(itemView);
                      btn = itemView.findViewById(R.id.btn_episode_item);
                  }
              }

              private class LiveAdapter extends RecyclerView.Adapter<LiveVH> {
                  @NonNull
                  @Override
                  public LiveVH onCreateViewHolder(@NonNull ViewGroup parent, int viewType) {
                      View v = LayoutInflater.from(parent.getContext()).inflate(R.layout.item_live_channel, parent, false);
                      return new LiveVH(v);
                  }

                  @Override
                  public void onBindViewHolder(@NonNull LiveVH holder, int position) {
                      LiveChannel ch = displayLiveChannels.get(position);
                      holder.tvNum.setText(String.format("%02d", position + 1));
                      holder.tvName.setText(ch.name);
                      holder.tvGroup.setText(ch.group);

                      if (position == currentPlayingLiveIndex) {
                          holder.tvIndicator.setVisibility(View.VISIBLE);
                          holder.tvName.setTextColor(0xFF6366F1);
                      } else {
                          holder.tvIndicator.setVisibility(View.GONE);
                          holder.tvName.setTextColor(0xFFFFFFFF);
                      }

                      holder.itemView.setOnClickListener(v -> {
                          currentPlayingLiveIndex = position;
                          notifyDataSetChanged();
                          playLiveStream(ch.name, ch.url);
                      });
                  }

                  @Override
                  public int getItemCount() {
                      return displayLiveChannels.size();
                  }
              }

              static class LiveVH extends RecyclerView.ViewHolder {
                  TextView tvNum, tvName, tvGroup, tvIndicator;
                  public LiveVH(@NonNull View itemView) {
                      super(itemView);
                      tvNum = itemView.findViewById(R.id.tv_live_num);
                      tvName = itemView.findViewById(R.id.tv_live_name);
                      tvGroup = itemView.findViewById(R.id.tv_live_group);
                      tvIndicator = itemView.findViewById(R.id.tv_live_indicator);
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileTVBox-APK
          path: app/build/outputs/apk/debug/*.apk
