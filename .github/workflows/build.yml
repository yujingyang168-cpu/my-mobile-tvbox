              private void checkInAppUpdate(boolean isUserTriggered) {
                  ProgressDialog progressDialog = new ProgressDialog(this);
                  if (isUserTriggered) {
                      progressDialog.setMessage("正在检测云端新版本...");
                      progressDialog.show();
                  }

                  String checkUrl = "https://gh-proxy.org/raw.githubusercontent.com/yujingyang168-cpu/my-mobile-tvbox/main/version.json";
                  Request req = new Request.Builder().url(checkUrl).build();

                  httpClient.newCall(req).enqueue(new Callback() {
                      @Override
                      public void onFailure(@NonNull Call call, @NonNull IOException e) {
                          runOnUiThread(() -> {
                              if (isUserTriggered) {
                                  progressDialog.dismiss();
                                  Toast.makeText(MainActivity.this, "网络连接异常，暂未检测到更新", Toast.LENGTH_SHORT).show();
                              }
                          });
                      }

                      @Override
                      public void onResponse(@NonNull Call call, @NonNull Response response) throws IOException {
                          if (response.isSuccessful() && response.body() != null) {
                              try {
                                  String resStr = response.body().string();
                                  JSONObject json = new JSONObject(resStr);
                                  int latestCode = json.optInt("versionCode", 0);
                                  String latestName = json.optString("versionName", "");
                                  String apkDownloadUrl = json.optString("apkUrl", "");
                                  String changelog = json.optString("changelog", "全新功能升级与性能优化");

                                  int currentCode = getPackageManager().getPackageInfo(getPackageName(), 0).versionCode;

                                  runOnUiThread(() -> {
                                      if (isUserTriggered) progressDialog.dismiss();
                                      if (latestCode > currentCode && !apkDownloadUrl.isEmpty()) {
                                          showUpdateConfirmDialog(latestName, changelog, apkDownloadUrl);
                                      } else if (isUserTriggered) {
                                          Toast.makeText(MainActivity.this, "当前已是最新版本！无需升级", Toast.LENGTH_SHORT).show();
                                      }
                                  });
                              } catch (Exception e) {
                                  runOnUiThread(() -> {
                                      if (isUserTriggered) progressDialog.dismiss();
                                  });
                              }
                          }
                      }
                  });
              }

              private void showUpdateConfirmDialog(String newVer, String logs, String apkUrl) {
                  AlertDialog.Builder b = new AlertDialog.Builder(this);
                  b.setTitle("🚀 发现新版本 V" + newVer);
                  b.setMessage("更新说明：\n" + logs);
                  b.setPositiveButton("立即在线升级", (d, w) -> startDownloadAndInstallApk(apkUrl));
                  b.setNegativeButton("稍后再说", null);
                  b.show();
              }

              private void startDownloadAndInstallApk(String url) {
                  ProgressDialog downloadDialog = new ProgressDialog(this);
                  downloadDialog.setTitle("正在下载最新升级包");
                  downloadDialog.setProgressStyle(ProgressDialog.STYLE_HORIZONTAL);
                  downloadDialog.setMax(100);
                  downloadDialog.setCancelable(false);
                  downloadDialog.show();

                  Request req = new Request.Builder().url(url).build();
                  httpClient.newCall(req).enqueue(new Callback() {
                      @Override
                      public void onFailure(@NonNull Call call, @NonNull IOException e) {
                          runOnUiThread(() -> {
                              downloadDialog.dismiss();
                              Toast.makeText(MainActivity.this, "下载失败，请检查网络", Toast.LENGTH_SHORT).show();
                          });
                      }

                      @Override
                      public void onResponse(@NonNull Call call, @NonNull Response response) throws IOException {
                          if (response.isSuccessful() && response.body() != null) {
                              File apkFile = new File(getExternalFilesDir(null), "update.apk");
                              long total = response.body().contentLength();
                              long downloaded = 0;

                              InputStream is = response.body().byteStream();
                              FileOutputStream fos = new FileOutputStream(apkFile);
                              byte[] buffer = new byte[8192];
                              int len;
                              while ((len = is.read(buffer)) != -1) {
                                  fos.write(buffer, 0, len);
                                  downloaded += len;
                                  int progress = (int) ((downloaded * 100) / total);
                                  runOnUiThread(() -> downloadDialog.setProgress(progress));
                              }
                              fos.flush();
                              fos.close();
                              is.close();

                              runOnUiThread(() -> {
                                  downloadDialog.dismiss();
                                  installApk(apkFile);
                              });
                          }
                      }
                  });
              }

              private void installApk(File apkFile) {
                  Intent intent = new Intent(Intent.ACTION_VIEW);
                  intent.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  Uri apkUri = FileProvider.getUriForFile(this, "com.mobile.tvbox.fileprovider", apkFile);
                  intent.setDataAndType(apkUri, "application/vnd.android.package-archive");
                  intent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                  startActivity(intent);
              }

              private void showPlayerSettingsDialog() {
                  String introStr = skipIntroSeconds == 0 ? "关闭" : (skipIntroSeconds + " 秒");
                  String outroStr = skipOutroSeconds == 0 ? "关闭" : (skipOutroSeconds + " 秒");
                  boolean isInfoVisible = prefs.getBoolean("show_always_info", true);

                  String[] options = new String[]{
                      "跳过片头: 【" + introStr + "】 (点击自定义)",
                      "跳过片尾: 【" + outroStr + "】 (点击自定义)",
                      "右上角电量与时间常驻: 【" + (isInfoVisible ? "显示" : "隐藏") + "】"
                  };

                  AlertDialog.Builder builder = new AlertDialog.Builder(this);
                  builder.setTitle("播放参数设置");
                  builder.setItems(options, (dialog, which) -> {
                      if (which == 0) showCustomSkipInputDialog(true);
                      else if (which == 1) showCustomSkipInputDialog(false);
                      else toggleAlwaysInfoVisibility();
                  });
                  builder.show();
              }

              private void showCustomSkipInputDialog(boolean isIntro) {
                  AlertDialog.Builder builder = new AlertDialog.Builder(this);
                  builder.setTitle(isIntro ? "自定义跳过片头秒数" : "自定义跳过片尾秒数");

                  final EditText input = new EditText(this);
                  input.setInputType(InputType.TYPE_CLASS_NUMBER);
                  input.setHint("请输入秒数 (输入 0 表示关闭)");
                  input.setText(String.valueOf(isIntro ? skipIntroSeconds : skipOutroSeconds));
                  builder.setView(input);

                  builder.setPositiveButton("确定保存", (dialog, which) -> {
                      String valStr = input.getText().toString().trim();
                      int seconds = 0;
                      try {
                          seconds = Math.max(0, Integer.parseInt(valStr));
                      } catch (Exception ignored) {}

                      if (isIntro) {
                          skipIntroSeconds = seconds;
                          prefs.edit().putInt("skip_intro_sec", seconds).apply();
                          Toast.makeText(this, "片头跳过已设为 " + seconds + " 秒", Toast.LENGTH_SHORT).show();
                      } else {
                          skipOutroSeconds = seconds;
                          prefs.edit().putInt("skip_outro_sec", seconds).apply();
                          Toast.makeText(this, "片尾跳过已设为 " + seconds + " 秒", Toast.LENGTH_SHORT).show();
                      }
                  });
                  builder.setNegativeButton("取消", null);
                  builder.show();
              }

              private void toggleAlwaysInfoVisibility() {
                  boolean current = prefs.getBoolean("show_always_info", true);
                  prefs.edit().putBoolean("show_always_info", !current).apply();
                  tvAlwaysInfo.setVisibility(!current ? View.VISIBLE : View.GONE);
                  if (!isScreenLocked) {
                      alwaysMiniProgress.setVisibility(!current ? View.VISIBLE : View.GONE);
                  }
                  Toast.makeText(this, !current ? "已开启全天候角标信息" : "已隐藏全天候信息", Toast.LENGTH_SHORT).show();
              }

              private void updatePlayPauseIcon() {
                  btnCenterPlay.setText(player.isPlaying() ? "⏸" : "▶");
              }

              private void updateEpisodeNavButtonsState() {
                  if (currentPlayingVod == null || currentPlayingVod.playGroups.isEmpty() || isLivePlaying) {
                      btnPrevEp.setAlpha(0.3f);
                      btnNextEp.setAlpha(0.3f);
                      btnPrevEp.setEnabled(false);
                      btnNextEp.setEnabled(false);
                      return;
                  }

                  PlayGroup group = currentPlayingVod.playGroups.get(currentGroupIndex);
                  btnPrevEp.setEnabled(currentEpisodeIndex > 0);
                  btnPrevEp.setAlpha(currentEpisodeIndex > 0 ? 1.0f : 0.3f);

                  btnNextEp.setEnabled(currentEpisodeIndex < group.episodes.size() - 1);
                  btnNextEp.setAlpha(currentEpisodeIndex < group.episodes.size() - 1 ? 1.0f : 0.3f);
              }

              private void playPrevEpisode() {
                  if (currentPlayingVod != null && currentEpisodeIndex > 0) {
                      playVodEpisode(currentPlayingVod, currentGroupIndex, currentEpisodeIndex - 1);
                  } else {
                      Toast.makeText(this, "已经是第一集了", Toast.LENGTH_SHORT).show();
                  }
              }

              private void playNextEpisode() {
                  if (currentPlayingVod != null) {
                      PlayGroup group = currentPlayingVod.playGroups.get(currentGroupIndex);
                      if (currentEpisodeIndex < group.episodes.size() - 1) {
                          playVodEpisode(currentPlayingVod, currentGroupIndex, currentEpisodeIndex + 1);
                      } else {
                          Toast.makeText(this, "已经播完最后一集", Toast.LENGTH_SHORT).show();
                      }
                  }
              }

              private void playVodEpisode(VodItem item, int groupIdx, int epIdx) {
                  currentPlayingVod = item;
                  currentGroupIndex = groupIdx;
                  currentEpisodeIndex = epIdx;
                  isLivePlaying = false;
                  hasPendingSkipIntro = true;

                  PlayGroup group = item.playGroups.get(groupIdx);
                  Episode ep = group.episodes.get(epIdx);

                  btnPrevEp.setVisibility(View.VISIBLE);
                  btnNextEp.setVisibility(View.VISIBLE);
                  btnRewind10.setVisibility(View.VISIBLE);
                  btnForward10.setVisibility(View.VISIBLE);
                  playerSeekBar.setVisibility(View.VISIBLE);
                  btnEpisodesSheet.setVisibility(View.VISIBLE);
                  btnQualitySwitch.setVisibility(View.VISIBLE);
                  btnAspectRatio.setVisibility(View.VISIBLE);
                  btnSpeedSwitch.setVisibility(View.VISIBLE);

                  updateEpisodeNavButtonsState();
                  playMedia(item.name + " · " + ep.title, ep.url);
              }

              private void playLiveStream(String name, String url) {
                  isLivePlaying = true;
                  currentPlayingVod = null;

                  btnPrevEp.setVisibility(View.GONE);
                  btnNextEp.setVisibility(View.GONE);
                  btnRewind10.setVisibility(View.GONE);
                  btnForward10.setVisibility(View.GONE);
                  playerSeekBar.setVisibility(View.INVISIBLE);
                  btnEpisodesSheet.setVisibility(View.GONE);
                  btnQualitySwitch.setVisibility(View.GONE);
                  btnAspectRatio.setVisibility(View.GONE);
                  btnSpeedSwitch.setVisibility(View.GONE);
                  tvCombinedTime.setText("🔴 实时直播");

                  playMedia(name, url);
              }

              private void playMedia(String title, String url) {
                  if (url == null || url.trim().isEmpty()) {
                      Toast.makeText(this, "无效的播放地址", Toast.LENGTH_SHORT).show();
                      return;
                  }
                  currentMediaUrl = url.trim().replace("&amp;", "&");
                  tvPlayerTitle.setText(title);
                  player.stop();

                  MediaItem.Builder builder = new MediaItem.Builder().setUri(currentMediaUrl);
                  if (currentMediaUrl.toLowerCase().contains(".m3u8") || currentMediaUrl.toLowerCase().contains("m3u8")) {
                      builder.setMimeType(MimeTypes.APPLICATION_M3U8);
                  } else if (currentMediaUrl.toLowerCase().contains(".mp4")) {
                      builder.setMimeType(MimeTypes.APPLICATION_MP4);
                  }

                  player.setMediaItem(builder.build());
                  player.prepare();
                  player.play();

                  resetHideControlsTimer();
              }

              private void startPeriodicUiUpdates() {
                  uiHandler.post(new Runnable() {
                      @Override
                      public void run() {
                          String curTime = new SimpleDateFormat("HH:mm", Locale.getDefault()).format(new Date());

                          BatteryManager bm = (BatteryManager) getSystemService(BATTERY_SERVICE);
                          int batteryLevel = bm != null ? bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY) : 100;

                          long duration = player != null ? player.getDuration() : 0;
                          long position = player != null ? player.getCurrentPosition() : 0;

                          String progressStr = isLivePlaying ? "🔴 实时直播" : (formatTime(position) + " / " + formatTime(duration));
                          tvAlwaysInfo.setText("🔋 " + batteryLevel + "%  " + curTime + " | " + progressStr);

                          if (player != null && !isLivePlaying && player.isPlaying() && !isUserSeeking) {
                              updateProgress();

                              if (skipOutroSeconds > 0 && duration > 40000L && position >= (duration - skipOutroSeconds * 1000L)) {
                                  if (currentPlayingVod != null) {
                                      PlayGroup group = currentPlayingVod.playGroups.get(currentGroupIndex);
                                      if (currentEpisodeIndex < group.episodes.size() - 1) {
                                          Toast.makeText(MainActivity.this, "已进入片尾，自动切换下一集", Toast.LENGTH_SHORT).show();
                                          playNextEpisode();
                                      }
                                  }
                              }
                          }
                          uiHandler.postDelayed(this, 1000);
                      }
                  });
              }

              private void updateProgress() {
                  long duration = player.getDuration();
                  long position = player.getCurrentPosition();

                  if (duration > 0) {
                      int progress = (int) ((position * 1000L) / duration);
                      playerSeekBar.setProgress(progress);

                      if (!isScreenLocked && prefs.getBoolean("show_always_info", true)) {
                          alwaysMiniProgress.setVisibility(View.VISIBLE);
                          alwaysMiniProgress.setProgress(progress);
                      } else {
                          alwaysMiniProgress.setVisibility(View.GONE);
                      }

                      tvCombinedTime.setText(formatTime(position) + " / " + formatTime(duration));
                  }
              }

              private String formatTime(long ms) {
                  long totalSeconds = Math.max(0, ms / 1000);
                  long seconds = totalSeconds % 60;
                  long minutes = (totalSeconds / 60) % 60;
                  long hours = totalSeconds / 3600;

                  if (hours > 0) {
                      return String.format(Locale.getDefault(), "%02d:%02d:%02d", hours, minutes, seconds);
                  } else {
                      return String.format(Locale.getDefault(), "%02d:%02d", minutes, seconds);
                  }
              }

              private void showRightEpisodesDrawer(VodItem vod) {
                  if (vod.playGroups.isEmpty()) return;
                  playerControlOverlay.setVisibility(View.GONE);
                  rightEpisodesDrawer.setVisibility(View.VISIBLE);

                  final int[] activeGroupIndex = {currentGroupIndex < vod.playGroups.size() ? currentGroupIndex : 0};

                  Runnable updateList = () -> {
                      PlayGroup group = vod.playGroups.get(activeGroupIndex[0]);
                      rightRecyclerEpisodes.setLayoutManager(new GridLayoutManager(this, 3));
                      rightRecyclerEpisodes.setAdapter(new RecyclerView.Adapter<EpisodeVH>() {
                          @NonNull
                          @Override
                          public EpisodeVH onCreateViewHolder(@NonNull ViewGroup parent, int viewType) {
                              View v = LayoutInflater.from(parent.getContext()).inflate(R.layout.item_episode_btn, parent, false);
                              return new EpisodeVH(v);
                          }

                          @Override
                          public void onBindViewHolder(@NonNull EpisodeVH holder, int position) {
                              Episode ep = group.episodes.get(position);
                              holder.btn.setText(ep.title);
                              boolean isCur = (vod == currentPlayingVod && activeGroupIndex[0] == currentGroupIndex && position == currentEpisodeIndex);
                              holder.btn.setBackgroundTintList(android.content.res.ColorStateList.valueOf(
                                  isCur ? 0xFF6366F1 : 0xFF21262D
                              ));
                              holder.btn.setOnClickListener(v -> {
                                  rightEpisodesDrawer.setVisibility(View.GONE);
                                  playVodEpisode(vod, activeGroupIndex[0], position);
                              });
                          }

                          @Override
                          public int getItemCount() { return group.episodes.size(); }
                      });
                  };

                  rightChipGroupSources.removeAllViews();
                  for (int i = 0; i < vod.playGroups.size(); i++) {
                      Chip chip = new Chip(this);
                      chip.setText(vod.playGroups.get(i).fromName);
                      chip.setCheckable(true);
                      chip.setChecked(i == activeGroupIndex[0]);
                      final int idx = i;
                      chip.setOnClickListener(v -> {
                          activeGroupIndex[0] = idx;
                          updateList.run();
                      });
                      rightChipGroupSources.addView(chip);
                  }
                  updateList.run();
              }

              private void showEpisodeSheet(VodItem vod) {
                  if (vod.playGroups.isEmpty()) {
                      Toast.makeText(this, "该影片暂无可用播放资源", Toast.LENGTH_SHORT).show();
                      return;
                  }

                  BottomSheetDialog sheet = new BottomSheetDialog(this);
                  View view = LayoutInflater.from(this).inflate(R.layout.dialog_episodes, null);
                  TextView title = view.findViewById(R.id.tv_episode_sheet_title);
                  title.setText(vod.name + " - 选集播放");

                  ChipGroup chipGroup = view.findViewById(R.id.chip_group_sources);
                  RecyclerView recycler = view.findViewById(R.id.recycler_episodes);
                  recycler.setLayoutManager(new GridLayoutManager(this, 4));

                  final int[] activeGroupIndex = {currentGroupIndex < vod.playGroups.size() ? currentGroupIndex : 0};

                  Runnable updateEpisodeList = () -> {
                      PlayGroup group = vod.playGroups.get(activeGroupIndex[0]);
                      recycler.setAdapter(new RecyclerView.Adapter<EpisodeVH>() {
                          @NonNull
                          @Override
                          public EpisodeVH onCreateViewHolder(@NonNull ViewGroup parent, int viewType) {
                              View v = LayoutInflater.from(parent.getContext()).inflate(R.layout.item_episode_btn, parent, false);
                              return new EpisodeVH(v);
                          }

                          @Override
                          public void onBindViewHolder(@NonNull EpisodeVH holder, int position) {
                              Episode ep = group.episodes.get(position);
                              holder.btn.setText(ep.title);
                              boolean isCurrent = (vod == currentPlayingVod && activeGroupIndex[0] == currentGroupIndex && position == currentEpisodeIndex);
                              holder.btn.setBackgroundTintList(android.content.res.ColorStateList.valueOf(
                                  isCurrent ? 0xFF6366F1 : 0xFF21262D
                              ));

                              holder.btn.setOnClickListener(v -> {
                                  sheet.dismiss();
                                  playVodEpisode(vod, activeGroupIndex[0], position);
                              });
                          }

                          @Override
                          public int getItemCount() { return group.episodes.size(); }
                      });
                  };

                  chipGroup.removeAllViews();
                  for (int i = 0; i < vod.playGroups.size(); i++) {
                      Chip chip = new Chip(this);
                      chip.setText(vod.playGroups.get(i).fromName);
                      chip.setCheckable(true);
                      chip.setChecked(i == activeGroupIndex[0]);
                      final int idx = i;
                      chip.setOnClickListener(v -> {
                          activeGroupIndex[0] = idx;
                          updateEpisodeList.run();
                      });
                      chipGroup.addView(chip);
                  }

                  updateEpisodeList.run();
                  sheet.setContentView(view);
                  sheet.show();
              }

              private void loadVodData(String keyword, String typeId) {
                  swipeVod.setRefreshing(true);
                  VodRoute route = vodRoutes.get(currentVodRouteIndex);
                  String url = route.api + "?ac=videolist";
                  if (typeId != null && !typeId.isEmpty()) {
                      url += "&t=" + typeId;
                  } else if (keyword != null && !keyword.isEmpty()) {
                      url += "&wd=" + keyword;
                  } else {
                      url += "&pg=1";
                  }

                  Request request = new Request.Builder().url(url).build();
                  httpClient.newCall(request).enqueue(new Callback() {
                      @Override
                      public void onFailure(@NonNull Call call, @NonNull IOException e) {
                          runOnUiThread(() -> {
                              swipeVod.setRefreshing(false);
                              Toast.makeText(MainActivity.this, "点播线路连接超时，请切换线路", Toast.LENGTH_SHORT).show();
                          });
                      }

                      @Override
                      public void onResponse(@NonNull Call call, @NonNull Response response) throws IOException {
                          if (response.isSuccessful() && response.body() != null) {
                              try {
                                  String bodyStr = response.body().string();
                                  JSONObject json = new JSONObject(bodyStr);

                                  JSONArray classArr = json.optJSONArray("class");
                                  if (classArr != null && classArr.length() > 0 && dynamicCategories.isEmpty()) {
                                      for (int c = 0; c < classArr.length(); c++) {
                                          JSONObject cObj = classArr.getJSONObject(c);
                                          dynamicCategories.add(new Category(
                                              cObj.optInt("type_id"),
                                              cObj.optInt("type_pid", 0),
                                              cObj.optString("type_name")
                                          ));
                                      }
                                  }

                                  JSONArray list = json.optJSONArray("list");
                                  List<VodItem> parsed = new ArrayList<>();
                                  if (list != null) {
                                      for (int i = 0; i < list.length(); i++) {
                                          JSONObject item = list.getJSONObject(i);
                                          VodItem v = new VodItem();
                                          v.id = item.optString("vod_id");
                                          v.name = item.optString("vod_name");
                                          v.pic = item.optString("vod_pic");
                                          v.remarks = item.optString("vod_remarks");
                                          v.playFrom = item.optString("vod_play_from");
                                          v.playUrl = item.optString("vod_play_url");
                                          parseVodGroups(v);
                                          parsed.add(v);
                                      }
                                  }
                                  runOnUiThread(() -> {
                                      vodList.clear();
                                      vodList.addAll(parsed);
                                      vodAdapter.notifyDataSetChanged();
                                      swipeVod.setRefreshing(false);
                                  });
                              } catch (Exception e) {
                                  runOnUiThread(() -> swipeVod.setRefreshing(false));
                              }
                          }
                      }
                  });
              }

              private void parseVodGroups(VodItem v) {
                  v.playGroups.clear();
                  if (v.playUrl == null || v.playUrl.trim().isEmpty()) return;

                  String[] fromArr = (v.playFrom != null && !v.playFrom.isEmpty()) ? v.playFrom.split("\\$\\$\\$") : new String[0];
                  String[] urlGroupArr = v.playUrl.split("\\$\\$\\$");

                  for (int g = 0; g < urlGroupArr.length; g++) {
                      PlayGroup group = new PlayGroup();
                      String rawFrom = (g < fromArr.length) ? fromArr[g].trim() : ("线路 " + (g + 1));
                      group.fromName = rawFrom.toUpperCase();

                      String[] eps = urlGroupArr[g].split("#|\\r?\\n");
                      for (String epStr : eps) {
                          epStr = epStr.trim();
                          if (epStr.isEmpty()) continue;

                          if (epStr.contains("$")) {
                              String[] parts = epStr.split("\\$");
                              String title = parts[0].trim();
                              String link = "";
                              for (int p = 1; p < parts.length; p++) {
                                  if (parts[p].trim().startsWith("http")) {
                                      link = parts[p].trim();
                                      break;
                                  }
                              }
                              if (link.isEmpty() && parts.length > 1) link = parts[1].trim();
                              if (link.startsWith("http")) group.episodes.add(new Episode(title, link));
                          } else if (epStr.startsWith("http")) {
                              group.episodes.add(new Episode("第 " + (group.episodes.size() + 1) + " 集", epStr));
                          }
                      }

                      if (!group.episodes.isEmpty()) v.playGroups.add(group);
                  }

                  v.playGroups.sort((g1, g2) -> {
                      boolean g1IsM3u = g1.fromName.contains("M3U") || (!g1.episodes.isEmpty() && g1.episodes.get(0).url.contains(".m3u8"));
                      boolean g2IsM3u = g2.fromName.contains("M3U") || (!g2.episodes.isEmpty() && g2.episodes.get(0).url.contains(".m3u8"));
                      if (g1IsM3u && !g2IsM3u) return -1;
                      if (!g1IsM3u && g2IsM3u) return 1;
                      return 0;
                  });
              }

              private void showVodRouteDialog() {
                  String[] names = new String[vodRoutes.size()];
                  for (int i = 0; i < vodRoutes.size(); i++) names[i] = vodRoutes.get(i).name;

                  AlertDialog.Builder builder = new AlertDialog.Builder(this);
                  builder.setTitle("选择 TVBox 点播线路仓");
                  builder.setSingleChoiceItems(names, currentVodRouteIndex, (dialog, which) -> {
                      currentVodRouteIndex = which;
                      dynamicCategories.clear();
                      VodRoute r = vodRoutes.get(which);
                      btnSwitchVodSource.setText(r.name + " ▼");
                      tvCurrentVodInfo.setText("当前已载入: " + r.name);
                      dialog.dismiss();
                      loadVodData("", "");
                  });
                  builder.show();
              }

