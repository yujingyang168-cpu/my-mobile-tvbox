              private void updateCacheDisplay() {
                  new Thread(() -> {
                      long sz = getDirSize(getCacheDir()) + getDirSize(getExternalCacheDir());
                      String str = formatFileSize(sz);
                      runOnUiThread(() -> tvCacheSize.setText(str + " >"));
                  }).start();
              }

              private void clearAppCache() {
                  ProgressDialog pd = new ProgressDialog(this);
                  pd.setMessage("正在清理缓存...");
                  pd.show();
                  new Thread(() -> {
                      deleteDir(getCacheDir());
                      deleteDir(getExternalCacheDir());
                      runOnUiThread(() -> Glide.get(MainActivity.this).clearMemory());
                      Glide.get(MainActivity.this).clearDiskCache();
                      runOnUiThread(() -> {
                          pd.dismiss();
                          updateCacheDisplay();
                          Toast.makeText(MainActivity.this, "缓存清理成功！", Toast.LENGTH_SHORT).show();
                      });
                  }).start();
              }

              private long getDirSize(File d) {
                  long s = 0;
                  if (d != null && d.isDirectory()) {
                      File[] fs = d.listFiles();
                      if (fs != null) for (File f : fs) s += f.isDirectory() ? getDirSize(f) : f.length();
                  } else if (d != null) s += d.length();
                  return s;
              }

              private boolean deleteDir(File d) {
                  if (d != null && d.isDirectory()) {
                      String[] cs = d.list();
                      if (cs != null) for (String c : cs) deleteDir(new File(d, c));
                      return d.delete();
                  } else if (d != null) return d.delete();
                  return false;
              }

              private String formatFileSize(long bytes) {
                  if (bytes <= 0) return "0.00 MB";
                  double mb = bytes / (1024.0 * 1024.0);
                  if (mb < 0.1) return String.format(Locale.getDefault(), "%.2f KB", bytes / 1024.0);
                  return String.format(Locale.getDefault(), "%.2f MB", mb);
              }

              private void checkInAppUpdate(boolean userTriggered) {
                  ProgressDialog pd = userTriggered ? ProgressDialog.show(this, "", "检测新版本中...") : null;
                  String checkUrl = "https://gh-proxy.org/raw.githubusercontent.com/yujingyang168-cpu/my-mobile-tvbox/main/version.json";

                  httpClient.newCall(new Request.Builder().url(checkUrl).build()).enqueue(new Callback() {
                      @Override public void onFailure(@NonNull Call call, @NonNull IOException e) {
                          if (pd != null) runOnUiThread(pd::dismiss);
                      }
                      @Override public void onResponse(@NonNull Call call, @NonNull Response response) throws IOException {
                          if (pd != null) runOnUiThread(pd::dismiss);
                          if (response.isSuccessful() && response.body() != null) {
                              try {
                                  JSONObject j = new JSONObject(response.body().string());
                                  int latestCode = j.optInt("versionCode", 0);
                                  String latestName = j.optString("versionName", "");
                                  String apkUrl = j.optString("apkUrl", "");
                                  String log = j.optString("changelog", "性能升级与界面重构");

                                  int curCode = getPackageManager().getPackageInfo(getPackageName(), 0).versionCode;
                                  runOnUiThread(() -> {
                                      tvAppVersionInfo.setText("V" + latestName + " >");
                                      if (latestCode > curCode && !apkUrl.isEmpty()) {
                                          new AlertDialog.Builder(MainActivity.this)
                                              .setTitle("🚀 发现新版本 V" + latestName)
                                              .setMessage("更新说明：\n" + log)
                                              .setPositiveButton("立即在线升级", (d, w) -> startDownloadAndInstall(apkUrl))
                                              .setNegativeButton("稍后", null).show();
                                      } else if (userTriggered) {
                                          Toast.makeText(MainActivity.this, "当前已是最新版本！", Toast.LENGTH_SHORT).show();
                                      }
                                  });
                              } catch (Exception ignored) {}
                          }
                      }
                  });
              }

              private void startDownloadAndInstall(String url) {
                  ProgressDialog pd = new ProgressDialog(this);
                  pd.setTitle("正在下载更新包");
                  pd.setProgressStyle(ProgressDialog.STYLE_HORIZONTAL);
                  pd.setMax(100);
                  pd.setCancelable(false);
                  pd.show();

                  httpClient.newCall(new Request.Builder().url(url).build()).enqueue(new Callback() {
                      @Override public void onFailure(@NonNull Call call, @NonNull IOException e) {
                          runOnUiThread(() -> { pd.dismiss(); Toast.makeText(MainActivity.this, "下载失败，请检查网络", Toast.LENGTH_SHORT).show(); });
                      }
                      @Override public void onResponse(@NonNull Call call, @NonNull Response response) throws IOException {
                          if (response.isSuccessful() && response.body() != null) {
                              File apk = new File(getExternalFilesDir(null), "update.apk");
                              long total = response.body().contentLength();
                              long downloaded = 0;
                              InputStream is = response.body().byteStream();
                              FileOutputStream fos = new FileOutputStream(apk);
                              byte[] buf = new byte[8192];
                              int len;
                              while ((len = is.read(buf)) != -1) {
                                  fos.write(buf, 0, len);
                                  downloaded += len;
                                  int p = (int) ((downloaded * 100) / total);
                                  runOnUiThread(() -> pd.setProgress(p));
                              }
                              fos.close(); is.close();
                              runOnUiThread(() -> {
                                  pd.dismiss();
                                  Intent it = new Intent(Intent.ACTION_VIEW);
                                  it.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  Uri u = FileProvider.getUriForFile(MainActivity.this, "com.mobile.tvbox.fileprovider", apk);
                                  it.setDataAndType(u, "application/vnd.android.package-archive");
                                  it.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                                  startActivity(it);
                              });
                          }
                      }
                  });
              }

