              private void initPlayer() {
                  DefaultHttpDataSource.Factory httpFactory = new DefaultHttpDataSource.Factory()
                      .setUserAgent("Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36")
                      .setAllowCrossProtocolRedirects(true)
                      .setConnectTimeoutMs(15000)
                      .setReadTimeoutMs(15000);

                  DefaultDataSource.Factory dataSourceFactory = new DefaultDataSource.Factory(this, httpFactory);
                  DefaultMediaSourceFactory mediaSourceFactory = new DefaultMediaSourceFactory(this).setDataSourceFactory(dataSourceFactory);

                  player = new ExoPlayer.Builder(this)
                      .setMediaSourceFactory(mediaSourceFactory)
                      .build();

                  playerView.setPlayer(player);

                  player.addListener(new Player.Listener() {
                      @Override
                      public void onPlaybackStateChanged(int state) {
                          bufferingProgress.setVisibility(state == Player.STATE_BUFFERING ? View.VISIBLE : View.GONE);
                          if (state == Player.STATE_READY) {
                              updatePlayPauseIcon();
                              updateProgress();

                              if (hasPendingSkipIntro && skipIntroSeconds > 0 && !isLivePlaying) {
                                  hasPendingSkipIntro = false;
                                  long skipMs = skipIntroSeconds * 1000L;
                                  if (player.getDuration() > skipMs) {
                                      player.seekTo(skipMs);
                                      Toast.makeText(MainActivity.this, "已跳过片头 " + skipIntroSeconds + " 秒", Toast.LENGTH_SHORT).show();
                                  }
                              }
                          } else if (state == Player.STATE_ENDED) {
                              playNextEpisode();
                          }
                      }

                      @Override
                      public void onIsPlayingChanged(boolean isPlaying) {
                          updatePlayPauseIcon();
                      }

                      @Override
                      public void onPlayerError(@NonNull PlaybackException error) {
                          bufferingProgress.setVisibility(View.GONE);
                          Toast.makeText(MainActivity.this, "播放失败(" + error.getErrorCodeName() + ")，请换线或选集", Toast.LENGTH_SHORT).show();
                      }
                  });
              }

              @SuppressLint("ClickableViewAccessibility")
              private void initTouchAndGestureEvents() {
                  playerContainer.setOnTouchListener((v, event) -> {
                      if (isScreenLocked) {
                          if (event.getAction() == MotionEvent.ACTION_UP) {
                              btnLockScreen.setVisibility(btnLockScreen.getVisibility() == View.VISIBLE ? View.GONE : View.VISIBLE);
                          }
                          return true;
                      }

                      if (rightEpisodesDrawer.getVisibility() == View.VISIBLE) {
                          if (event.getAction() == MotionEvent.ACTION_UP) {
                              rightEpisodesDrawer.setVisibility(View.GONE);
                          }
                          return true;
                      }

                      switch (event.getAction()) {
                          case MotionEvent.ACTION_DOWN:
                              touchStartX = event.getX();
                              touchStartY = event.getY();
                              touchDownPosition = player.getCurrentPosition();
                              isHorizontalDragging = false;
                              isVerticalBrightnessDragging = false;

                              float curBrightness = getWindow().getAttributes().screenBrightness;
                              if (curBrightness < 0) {
                                  try {
                                      int sysBrightness = android.provider.Settings.System.getInt(
                                          getContentResolver(),
                                          android.provider.Settings.System.SCREEN_BRIGHTNESS
                                      );
                                      touchDownBrightness = sysBrightness / 255.0f;
                                  } catch (Exception e) {
                                      touchDownBrightness = 0.5f;
                                  }
                              } else {
                                  touchDownBrightness = curBrightness;
                              }
                              break;

                          case MotionEvent.ACTION_MOVE:
                              float deltaX = event.getX() - touchStartX;
                              float deltaY = event.getY() - touchStartY;

                              if (!isHorizontalDragging && !isVerticalBrightnessDragging) {
                                  if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 40) {
                                      if (!isLivePlaying && player.isCurrentMediaItemSeekable()) {
                                          isHorizontalDragging = true;
                                          uiHandler.removeCallbacks(hideControlsRunnable);
                                          playerControlOverlay.setVisibility(View.GONE);
                                          layoutGestureSeek.setVisibility(View.VISIBLE);
                                      }
                                  } else if (Math.abs(deltaY) > Math.abs(deltaX) && Math.abs(deltaY) > 40) {
                                      if (touchStartX > (playerContainer.getWidth() * 0.5f)) {
                                          isVerticalBrightnessDragging = true;
                                          uiHandler.removeCallbacks(hideControlsRunnable);
                                          playerControlOverlay.setVisibility(View.GONE);
                                          layoutBrightnessIndicator.setVisibility(View.VISIBLE);
                                      }
                                  }
                              }

                              if (isHorizontalDragging) {
                                  long duration = player.getDuration();
                                  if (duration > 0) {
                                      float factor = deltaX / playerContainer.getWidth();
                                      long offsetMs = (long) (factor * 90000);
                                      targetGesturePosition = Math.max(0, Math.min(duration, touchDownPosition + offsetMs));

                                      tvGestureTargetTime.setText(formatTime(targetGesturePosition));
                                      String sign = offsetMs >= 0 ? "+" : "-";
                                      tvGestureDeltaTime.setText(sign + formatTime(Math.abs(offsetMs)));
                                  }
                              }

                              if (isVerticalBrightnessDragging) {
                                  float deltaBrightness = - (deltaY / (float) playerContainer.getHeight());
                                  float newBrightness = Math.max(0.01f, Math.min(1.0f, touchDownBrightness + deltaBrightness));

                                  WindowManager.LayoutParams lp = getWindow().getAttributes();
                                  lp.screenBrightness = newBrightness;
                                  getWindow().setAttributes(lp);

                                  tvBrightnessPercent.setText(((int) (newBrightness * 100)) + "%");
                              }
                              break;

                          case MotionEvent.ACTION_UP:
                          case MotionEvent.ACTION_CANCEL:
                              if (isHorizontalDragging) {
                                  isHorizontalDragging = false;
                                  layoutGestureSeek.setVisibility(View.GONE);
                                  player.seekTo(targetGesturePosition);
                                  resetHideControlsTimer();
                              } else if (isVerticalBrightnessDragging) {
                                  isVerticalBrightnessDragging = false;
                                  layoutBrightnessIndicator.setVisibility(View.GONE);
                                  resetHideControlsTimer();
                              } else {
                                  if (playerControlOverlay.getVisibility() == View.VISIBLE) {
                                      playerControlOverlay.setVisibility(View.GONE);
                                      btnLockScreen.setVisibility(View.GONE);
                                      uiHandler.removeCallbacks(hideControlsRunnable);
                                  } else {
                                      playerControlOverlay.setVisibility(View.VISIBLE);
                                      btnLockScreen.setVisibility(View.VISIBLE);
                                      resetHideControlsTimer();
                                  }
                              }
                              break;
                      }
                      return true;
                  });
              }

              private final Runnable hideControlsRunnable = () -> {
                  if (playerControlOverlay != null && playerControlOverlay.getVisibility() == View.VISIBLE && !isScreenLocked) {
                      playerControlOverlay.setVisibility(View.GONE);
                      btnLockScreen.setVisibility(View.GONE);
                  }
              };

              private void resetHideControlsTimer() {
                  uiHandler.removeCallbacks(hideControlsRunnable);
                  if (playerControlOverlay.getVisibility() == View.VISIBLE && !isScreenLocked) {
                      uiHandler.postDelayed(hideControlsRunnable, 5000);
                  }
              }

              private void initEnhancedControlEvents() {
                  btnLockScreen.setOnClickListener(v -> {
                      isScreenLocked = !isScreenLocked;
                      if (isScreenLocked) {
                          btnLockScreen.setText("🔒");
                          playerControlOverlay.setVisibility(View.GONE);
                          alwaysMiniProgress.setVisibility(View.GONE);
                          Toast.makeText(this, "屏幕已锁定，手势与按钮已禁用", Toast.LENGTH_SHORT).show();
                      } else {
                          btnLockScreen.setText("🔓");
                          playerControlOverlay.setVisibility(View.VISIBLE);
                          if (prefs.getBoolean("show_always_info", true)) {
                              alwaysMiniProgress.setVisibility(View.VISIBLE);
                          }
                          resetHideControlsTimer();
                          Toast.makeText(this, "屏幕已解锁", Toast.LENGTH_SHORT).show();
                      }
                  });

                  btnCenterPlay.setOnClickListener(v -> {
                      resetHideControlsTimer();
                      if (player.isPlaying()) player.pause();
                      else player.play();
                      updatePlayPauseIcon();
                  });

                  btnRewind10.setOnClickListener(v -> {
                      resetHideControlsTimer();
                      if (!isLivePlaying && player.isCurrentMediaItemSeekable()) {
                          player.seekTo(Math.max(0, player.getCurrentPosition() - 10000));
                      }
                  });

                  btnForward10.setOnClickListener(v -> {
                      resetHideControlsTimer();
                      if (!isLivePlaying && player.isCurrentMediaItemSeekable()) {
                          player.seekTo(Math.min(player.getDuration(), player.getCurrentPosition() + 10000));
                      }
                  });

                  btnPrevEp.setOnClickListener(v -> {
                      resetHideControlsTimer();
                      playPrevEpisode();
                  });

                  btnNextEp.setOnClickListener(v -> {
                      resetHideControlsTimer();
                      playNextEpisode();
                  });

                  btnEpisodesSheet.setOnClickListener(v -> {
                      resetHideControlsTimer();
                      if (currentPlayingVod != null) {
                          int orientation = getResources().getConfiguration().orientation;
                          if (orientation == Configuration.ORIENTATION_LANDSCAPE) {
                              showRightEpisodesDrawer(currentPlayingVod);
                          } else {
                              showEpisodeSheet(currentPlayingVod);
                          }
                      } else {
                          Toast.makeText(this, "当前未播放点播影片", Toast.LENGTH_SHORT).show();
                      }
                  });

                  btnQualitySwitch.setOnClickListener(v -> {
                      resetHideControlsTimer();
                      showQualityDialog();
                  });

                  btnAspectRatio.setOnClickListener(v -> {
                      resetHideControlsTimer();
                      showAspectRatioDialog();
                  });

                  btnCastScreen.setOnClickListener(v -> {
                      resetHideControlsTimer();
                      showCastScreenDialog();
                  });

                  btnSpeedSwitch.setOnClickListener(v -> {
                      resetHideControlsTimer();
                      currentSpeedIndex = (currentSpeedIndex + 1) % speeds.length;
                      float speed = speeds[currentSpeedIndex];
                      player.setPlaybackSpeed(speed);
                      btnSpeedSwitch.setText(speed + "x");
                      Toast.makeText(this, "倍速: " + speed + "x", Toast.LENGTH_SHORT).show();
                  });

                  btnPlayerSettings.setOnClickListener(v -> {
                      resetHideControlsTimer();
                      showPlayerSettingsDialog();
                  });

                  playerSeekBar.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override
                      public void onProgressChanged(SeekBar seekBar, int progress, boolean fromUser) {
                          if (fromUser && !isLivePlaying) {
                              long duration = player.getDuration();
                              if (duration > 0) {
                                  long newPos = (duration * progress) / 1000L;
                                  tvCombinedTime.setText(formatTime(newPos) + " / " + formatTime(duration));
                              }
                          }
                      }

                      @Override
                      public void onStartTrackingTouch(SeekBar seekBar) {
                          isUserSeeking = true;
                          uiHandler.removeCallbacks(hideControlsRunnable);
                      }

                      @Override
                      public void onStopTrackingTouch(SeekBar seekBar) {
                          isUserSeeking = false;
                          if (!isLivePlaying) {
                              long duration = player.getDuration();
                              if (duration > 0) {
                                  long newPos = (duration * seekBar.getProgress()) / 1000L;
                                  player.seekTo(newPos);
                              }
                          }
                          resetHideControlsTimer();
                      }
                  });

                  btnFullscreen.setOnClickListener(v -> {
                      resetHideControlsTimer();
                      toggleFullscreen();
                  });
              }

              private void showQualityDialog() {
                  AlertDialog.Builder builder = new AlertDialog.Builder(this);
                  builder.setTitle("选择视频清晰度");
                  builder.setSingleChoiceItems(qualityNames, currentQualityIndex, (dialog, which) -> {
                      currentQualityIndex = which;
                      String qName = qualityNames[which];
                      btnQualitySwitch.setText(qName.split(" ")[0]);

                      int maxW = Integer.MAX_VALUE;
                      int maxH = Integer.MAX_VALUE;
                      if (qName.contains("1080")) { maxW = 1920; maxH = 1080; }
                      else if (qName.contains("720")) { maxW = 1280; maxH = 720; }
                      else if (qName.contains("480")) { maxW = 854; maxH = 480; }

                      player.setTrackSelectionParameters(
                          player.getTrackSelectionParameters().buildUpon().setMaxVideoSize(maxW, maxH).build()
                      );
                      Toast.makeText(this, "清晰度已切换为: " + qName, Toast.LENGTH_SHORT).show();
                      dialog.dismiss();
                  });
                  builder.show();
              }

              private void showAspectRatioDialog() {
                  String[] ratioOptions = new String[]{
                      "自适应 (保持原片比例 Fit)",
                      "拉伸铺满 (全屏无边框 Fill)",
                      "居中裁剪 (等比充满画面 Zoom)",
                      "定宽自适应 (Fixed Width)",
                      "定高自适应 (Fixed Height)"
                  };

                  AlertDialog.Builder builder = new AlertDialog.Builder(this);
                  builder.setTitle("选择画面缩放比例");
                  builder.setSingleChoiceItems(ratioOptions, resizeModeIndex, (dialog, which) -> {
                      resizeModeIndex = which;
                      if (which == 0) playerView.setResizeMode(AspectRatioFrameLayout.RESIZE_MODE_FIT);
                      else if (which == 1) playerView.setResizeMode(AspectRatioFrameLayout.RESIZE_MODE_FILL);
                      else if (which == 2) playerView.setResizeMode(AspectRatioFrameLayout.RESIZE_MODE_ZOOM);
                      else if (which == 3) playerView.setResizeMode(AspectRatioFrameLayout.RESIZE_MODE_FIXED_WIDTH);
                      else playerView.setResizeMode(AspectRatioFrameLayout.RESIZE_MODE_FIXED_HEIGHT);

                      Toast.makeText(this, "画面比例已调整: " + ratioOptions[which], Toast.LENGTH_SHORT).show();
                      dialog.dismiss();
                  });
