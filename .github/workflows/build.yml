                  for (int i = 0; i < mainTabs.length; i++) {
                      Chip chip = new Chip(this);
                      chip.setText(mainTabs[i]);
                      chip.setCheckable(true);
                      chip.setChecked(i == 1);
                      final int idx = i;
                      chip.setOnClickListener(v -> {
                          if (idx == 0) loadVodData("热播", "");
                          else if (idx == 1) loadVodData("", "1");
                          else if (idx == 2) loadVodData("", "2");
                          else if (idx == 3) loadVodData("", "3");
                          else loadVodData("", "4");
                      });
                      chipGroupMainTypes.addView(chip);
                  }
                  setupMatrixRow(chipGroupRow1Type, new String[]{"全部类型", "动作", "喜剧", "爱情", "科幻", "恐怖", "战争", "悬疑"});
                  setupMatrixRow(chipGroupRow2Area, new String[]{"全部地区", "华语", "欧美", "韩国", "日本", "泰国", "英国"});
                  setupMatrixRow(chipGroupRow3Sort, new String[]{"近期热度", "首映时间", "高分优先"});
                  setupMatrixRow(chipGroupRow4Year, new String[]{"全部年代", "2026", "2025", "2024", "2023", "2022"});
              }

              private void setupMatrixRow(ChipGroup group, String[] items) {
                  group.removeAllViews();
                  for (int i = 0; i < items.length; i++) {
                      Chip chip = new Chip(this);
                      chip.setText(items[i]);
                      chip.setCheckable(true);
                      chip.setChecked(i == 0);
                      final String text = items[i];
                      chip.setOnClickListener(v -> {
                          if (!text.startsWith("全部") && !text.equals("近期热度")) {
                              loadVodData(text, "");
                          } else {
                              loadVodData("", "");
                          }
                      });
                      group.addView(chip);
                  }
              }

              private void initSearchWatcher() {
                  etSearch.setOnFocusChangeListener((v, hasFocus) -> {
                      if (hasFocus) {
                          layoutSearchSuggestions.setVisibility(View.VISIBLE);
                          updateSuggestions(etSearch.getText().toString().trim());
                      }
                  });
                  etSearch.addTextChangedListener(new TextWatcher() {
                      @Override public void beforeTextChanged(CharSequence s, int start, int count, int after) {}
                      @Override public void onTextChanged(CharSequence s, int start, int before, int count) {
                          String text = s.toString().trim();
                          updateSuggestions(text);
                          layoutSearchSuggestions.setVisibility(View.VISIBLE);
                      }
                      @Override public void afterTextChanged(Editable s) {}
                  });
                  etSearch.setOnEditorActionListener((v, actionId, event) -> {
                      if (actionId == EditorInfo.IME_ACTION_SEARCH || (event != null && event.getKeyCode() == KeyEvent.KEYCODE_ENTER)) {
                          executeSearch(etSearch.getText().toString().trim());
                          return true;
                      }
                      return false;
                  });
              }

              private void updateSuggestions(String query) {
                  currentSuggestions.clear();
                  if (query.isEmpty()) {
                      currentSuggestions.add("繁花");
                      currentSuggestions.add("庆余年");
                      currentSuggestions.add("狂飙");
                      currentSuggestions.add("三体");
                      currentSuggestions.add("无处释放我");
                  } else {
                      currentSuggestions.add("全网搜索: " + query);
                      fetchOnlineBaiduSuggestions(query);
                  }
                  suggestionAdapter.notifyDataSetChanged();
              }

              private void fetchOnlineBaiduSuggestions(String kw) {
                  try {
                      String url = "https://suggestion.baidu.com/su?wd=" + URLEncoder.encode(kw, "UTF-8") + "&action=opensearch";
                      Request req = new Request.Builder().url(url).build();
                      httpClient.newCall(req).enqueue(new Callback() {
                          @Override public void onFailure(@NonNull Call call, @NonNull IOException e) {}
                          @Override public void onResponse(@NonNull Call call, @NonNull Response response) throws IOException {
                              if (response.isSuccessful() && response.body() != null) {
                                  try {
                                      JSONArray arr = new JSONArray(response.body().string());
                                      if (arr.length() >= 2) {
                                          JSONArray list = arr.getJSONArray(1);
                                          List<String> netItems = new ArrayList<>();
                                          for (int i = 0; i < Math.min(list.length(), 6); i++) netItems.add(list.getString(i));
                                          runOnUiThread(() -> {
                                              currentSuggestions.clear();
                                              currentSuggestions.addAll(netItems);
                                              if (currentSuggestions.isEmpty()) currentSuggestions.add(kw);
                                              suggestionAdapter.notifyDataSetChanged();
                                          });
                                      }
                                  } catch (Exception ignored) {}
                              }
                          }
                      });
                  } catch (Exception ignored) {}
              }

              private void executeSearch(String keyword) {
                  etSearch.setText(keyword);
                  etSearch.setSelection(keyword.length());
                  layoutSearchSuggestions.setVisibility(View.GONE);
                  View v = getCurrentFocus();
                  if (v != null) {
                      InputMethodManager imm = (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                      if (imm != null) imm.hideSoftInputFromWindow(v.getWindowToken(), 0);
                  }
                  loadVodData(keyword, "");
              }

